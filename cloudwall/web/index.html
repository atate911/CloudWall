<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CloudWall</title>
<link rel="preload" href="fonts/b612.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/b612-mono-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">CloudWall</div>
  <div class="chips">
    <span class="chip" id="flow" hidden></span>
    <span class="chip" id="wx" hidden></span>
    <span class="chip warn" id="link" hidden>Flight data offline</span>
  </div>
  <button class="icon-btn" id="btn-sound" title="Chime when an aircraft comes overhead"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3.5 9.2h3.6L12 5.2v13.6l-4.9-4H3.5z"/><g id="snd-on"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/></g><g id="snd-off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg><span id="snd-text">Sound</span></button>
  <button class="icon-btn" id="btn-night" title="Night mode: auto follows the sun"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/></svg><span id="night-text">Auto</span></button>
  <div class="clock" id="clock"></div>
</header>
<main>
  <section id="view-now" class="view active">
    <div class="panel" id="hero"></div>
    <div class="panel scope" id="scope">
      <div class="seg" id="scope-seg" role="group" aria-label="Map view">
        <button data-mode="auto" title="Sky view while a plane is overhead, radar otherwise">Auto</button>
        <button data-mode="radar">Radar</button>
        <button data-mode="sky">Sky</button>
      </div>
      <svg id="radar" viewBox="-112 -112 224 224" role="img" aria-label="Nearby aircraft"></svg>
      <div class="scope-caption" id="scope-caption"></div>
      <div class="attrib" id="scope-attrib"></div>
    </div>
  </section>
  <section id="view-board" class="view"><div class="panel scroll" id="board"></div></section>
  <section id="view-log" class="view"><div class="panel scroll" id="log"></div></section>
</main>
<nav>
  <button data-view="now" class="active">Overhead</button>
  <button data-view="board">Board <span id="n-board"></span></button>
  <button data-view="log">Logbook <span id="n-log"></span></button>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
