<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e1e5dc">
<title>CloudWall</title>
<link rel="preload" href="fonts/b612.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/b612-mono-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/b612-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">CloudWall<button class="station" id="station" aria-haspopup="menu" aria-expanded="false" disabled></button>
    <div class="place-menu" id="place-menu" role="menu" aria-label="Places" hidden></div></div>
  <div class="chips">
    <span class="chip" id="flow" hidden></span>
    <span class="chip" id="wx" hidden></span>
    <button class="chip em-chip" id="em-chip" hidden></button>
    <span class="chip" id="tfr-chip" hidden></span>
    <span class="chip warn" id="link" hidden>Flight data offline</span>
    <span class="chip warn" id="restart" hidden title="CloudWall's code changed after it started (an update), so the server is still running the old version. Restart it to finish: make restart, or systemctl --user restart cloudwall">Updated: restart CloudWall</span>
  </div>
  <div class="seg dens" id="dens-seg" role="group" aria-label="How much to show">
    <button data-dens="simple" title="What's happening now: the next aircraft over the house, the landing queue, and anything worth a look">Simple</button>
    <button data-dens="detailed" title="Every aircraft labelled, grouped by what it is doing, with the flight card and the side view">Detailed</button>
  </div>
  <button class="icon-btn" id="btn-sound" title="Chime when an aircraft comes overhead"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3.5 9.2h3.6L12 5.2v13.6l-4.9-4H3.5z"/><g id="snd-on"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/></g><g id="snd-off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg><span id="snd-text">Sound</span></button>
  <button class="icon-btn" id="btn-night" title="Night mode: auto follows the sun"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/></svg><span id="night-text">Auto</span></button>
  <div class="clock" id="clock"></div>
</header>
<main>
  <section id="view-now" class="view active">
    <div class="strip" id="strip" aria-live="polite"></div>
    <div class="panel" id="hero"></div>
    <div class="panel ss" id="side"></div>
    <div class="panel scope" id="scope">
      <div class="seg" id="scope-seg" role="group" aria-label="Map view">
        <button data-mode="radar" title="The flights on a radar scope, as pilots and controllers see them">Radar</button>
        <button data-mode="map" title="The flights on an everyday map">Map</button>
      </div>
      <div class="scope-tools">
        <div class="seg" id="mapstyle-seg" role="group" aria-label="Map style">
          <button data-map="sat" title="Satellite photos, with roads and place names">Satellite</button>
          <button data-map="streets" title="A street map">Streets</button>
        </div>
        <div class="seg" id="style-seg" role="group" aria-label="Radar style">
          <button data-style="chart" title="Radar drawn as a chart">Chart</button>
          <button data-style="atc" title="Radar drawn like an air traffic control screen">ATC</button>
        </div>
        <div class="seg"><button id="btn-tracks" aria-pressed="true" title="The selected aircraft's track behind it (history dots in the ATC style) and lines to where aircraft will be in a minute">Tracks</button></div>
        <div class="seg" id="range-seg" role="group" aria-label="Radar range" title="How far out the radar shows"></div>
      </div>
      <svg id="radar" viewBox="-112 -112 224 224" role="img" aria-label="Nearby aircraft"></svg>
      <div class="attrib" id="scope-attrib"></div>
    </div>
    <div class="pane-split" id="pane-split" role="separator" aria-orientation="vertical" aria-controls="mini-board"
      aria-valuemin="0" aria-valuemax="100" tabindex="0" title="Drag to give the radar more or less room. Double-click for the usual width.">
      <button class="ps-toggle" id="ps-toggle" aria-controls="mini-board" aria-expanded="true">
        <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M3.5 3.5L7.5 8l-4 4.5"/></svg></button>
    </div>
    <div class="panel ss" id="notes"></div>
    <div class="panel scroll" id="mini-board"></div>
    <button class="show-all" id="show-all" aria-controls="mini-board" aria-expanded="false"></button>
  </section>
  <section id="view-board" class="view"><div class="panel scroll" id="board"></div></section>
  <section id="view-wx" class="view"><div class="panel scroll" id="wx-tab"></div></section>
  <section id="view-log" class="view"><div class="panel scroll" id="log"></div></section>
</main>
<nav>
  <button data-view="now" class="active">Overhead</button>
  <button data-view="board">Board <span id="n-board"></span></button>
  <button data-view="wx">Weather <span id="n-wx"></span></button>
  <button data-view="log">Logbook <span id="n-log"></span></button>
</nav>
<dialog class="loc-dialog" id="loc-dialog" aria-labelledby="loc-title">
  <form id="loc-form">
    <h2 id="loc-title">Set a location</h2>
    <label class="loc-field"><span class="label">ZIP code or coordinates</span>
      <input id="loc-q" autocomplete="postal-code" spellcheck="false" placeholder="98683   or   45.63, -122.66" required></label>
    <p class="loc-where" id="loc-where" aria-live="polite"></p>
    <label class="loc-field"><span class="label">Name</span><input id="loc-name" maxlength="40" placeholder="Optional, such as Cabin"></label>
    <fieldset class="loc-airports" id="loc-airports"></fieldset>
    <p class="loc-error" id="loc-error" role="alert"></p>
    <div class="loc-actions"><button type="button" class="loc-btn" id="loc-cancel">Cancel</button>
      <button class="loc-btn primary" id="loc-save" disabled>Show this place</button></div>
  </form>
</dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
