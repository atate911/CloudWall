<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CloudWall control board</title>
<link rel="preload" href="fonts/b612.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./" title="Back to the board">CloudWall</a>
  <span class="where">Control board</span>
  <span class="pill" id="state" hidden></span>
  <span class="grow"></span>
  <label class="switch" title="Show the explanation under every setting and problem (hover over any of them for it anyway)">
    <input type="checkbox" id="help-all"> Help
  </label>
  <button class="link" id="signout" hidden>Sign out</button>
</header>
<div class="restart-bar" id="restart-bar" hidden>
  <span>Saved. The new settings take effect when CloudWall restarts.</span>
  <button class="btn" id="restart-now">Restart now</button>
</div>
<div class="shell">
  <nav class="side" id="nav" aria-label="Control board"></nav>
  <main id="main" tabindex="-1">
    <p class="dim">Loading…</p>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
