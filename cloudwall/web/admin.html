<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>CloudWall control board</title>
<link rel="preload" href="fonts/b612.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/b612-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="frame">
  <aside class="rail" aria-label="The parts of CloudWall">
    <a class="brand" href="./" title="Open the wall">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13.5"/><circle cx="16" cy="16" r="7.5"/><path d="M16 2.5v27M2.5 16h27"/><path class="brand-plane" d="M21.5 8.6l1.9 1.9-4.6 3.4 1 6.4-1.3 1.3-2.4-5.4-3.3 3.1.3 2.2-1 1-1.3-2.7-2.7-1.3 1-1 2.2.3 3.1-3.3-5.4-2.4 1.3-1.3 6.4 1z"/></svg>
      <span><b>CloudWall</b><small>Control board</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <label class="explain-toggle" title="Show every setting's full explanation, its default and when it takes effect, under it">
        <input type="checkbox" id="explain"><span class="explain-track"><span class="knob"></span></span>Explain every setting</label>
      <div class="rail-foot-row"><span id="version"></span><button class="quiet-btn" id="signout" hidden>Sign out</button></div>
    </div>
  </aside>
  <main id="main" tabindex="-1"><p class="loading">Loading the board…</p></main>
</div>
<div class="dock" id="dock" hidden role="region" aria-label="Changes waiting for a restart">
  <div class="dock-list" id="dock-list" hidden></div>
  <div class="dock-bar">
    <span class="dock-dot" aria-hidden="true"></span>
    <button class="dock-text" id="dock-text" type="button" aria-expanded="false" aria-controls="dock-list"></button>
    <button class="btn" id="dock-restart">Restart now</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/admin/main.js"></script>
</body>
</html>
