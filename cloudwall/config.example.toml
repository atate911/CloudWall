# CloudWall settings. Every key is optional; these are the defaults.
# Restart CloudWall after editing.

[home]
name = "Home"
lat = 45.5900          # <-- set to your house (decimal degrees)
lon = -122.4740
elevation_ft = 100

[airport]              # the local airport: used for arriving/departing labels and weather
icao = "KPDX"
iata = "PDX"
city = "Portland"
lat = 45.5887
lon = -122.5975

[tracking]
radius_nm = 15         # how far out the board and radar look
overhead_nm = 3.5      # inside this, an aircraft takes over the screen and is logged
max_overhead_alt_ft = 45000
poll_seconds = 5       # be kind to the free API; don't go below ~3

[source]               # position feeds (readsb-style JSON), tried in order with automatic failover
urls = [
  "https://opendata.adsb.fi/api/v3/lat/{lat}/lon/{lon}/dist/{radius}",
  "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}",
]

# --- Optional paid route providers -------------------------------------------------
# Accurate live origin/destination and arrival time. Set a key for ONE of them
# (if both are set, Flightradar24 is used). Lookups are billed, so CloudWall only
# asks about aircraft that are overhead or about to be, and stops at daily_limit.

[flightradar24]        # official Flightradar24 API (subscription with monthly credits)
api_key = ""           # your API token (or set CLOUDWALL_FR24_KEY)
daily_limit = 100      # hard cap on lookups per day; check your credit use, then adjust
mode = "fallback"      # "fallback": only when the free route is missing or wrong; "always": every overhead airliner
general_aviation = false   # also look up private aircraft; most have no route
sandbox = false        # true with a sandbox token: free, but returns fixed sample data

[flightaware]          # FlightAware AeroAPI (billed per lookup)
api_key = ""           # your AeroAPI key (or set CLOUDWALL_FLIGHTAWARE_KEY)
daily_limit = 30
mode = "fallback"
general_aviation = false

[map]                  # faint map under the radar, cached on disk by CloudWall
style = "dark"         # "dark" or "light" grey street map, "satellite", "osm" (OpenStreetMap), or "off"
opacity = 0.5          # 0 to 1; the radar keeps it dim either way
# Any other raster tile service, e.g. CARTO with your API key. Paste the provider's
# raster URL template; {z} {x} {y} (and {s} {r}) are filled in. The key stays on
# your server: the browser only ever loads tiles from CloudWall.
# CARTO Dark Matter without labels (CARTO wants the key as a "key" URL parameter):
# url = "https://basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png?key=YOUR_CARTO_KEY"
# attribution = "© OpenStreetMap contributors © CARTO"   # the credit the provider asks for

[server]
host = "0.0.0.0"
port = 5050

[storage]
db_path = ""           # empty: ~/.local/share/cloudwall/cloudwall.db
