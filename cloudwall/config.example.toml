# CloudWall settings. Every key is optional; these are the defaults.
# Restart CloudWall after editing.

[home]
name = "Home"
lat = 45.5900          # <-- set to your house (decimal degrees)
lon = -122.4740
elevation_ft = 100

[airport]              # the local airport: used for arriving/departing labels and weather
icao = "KPDX"
iata = "PDX"
city = "Portland"
lat = 45.5887
lon = -122.5975
# Smaller fields nearby: light aircraft low over them are labelled as theirs, and they're
# marked on the radar. Pearson Field and Troutdale are built in; listing any here replaces them.
# [[airport.others]]
# code = "VUO"
# name = "Pearson Field"
# city = "Vancouver"
# lat = 45.6205
# lon = -122.6564
# elevation_ft = 25

[tracking]
radius_nm = 15         # how far out the board and radar look
overhead_nm = 3.5      # inside this, an aircraft takes over the screen and is logged
max_overhead_alt_ft = 45000
poll_seconds = 5       # be kind to the free API; don't go below ~3
when_idle = "pause"    # when no screen has been open for idle_after_seconds:
                       #   "pause" makes no requests at all (the logbook misses flyovers meanwhile)
                       #   "log" checks the free position feed every 15 s so the logbook stays complete
                       # Either way, no paid route lookups and no weather while nobody is looking.
idle_after_seconds = 90

[source]               # position feeds (readsb-style JSON), tried in order with automatic failover
urls = [
  "https://opendata.adsb.fi/api/v3/lat/{lat}/lon/{lon}/dist/{radius}",
  "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}",
]

# --- Optional paid route providers -------------------------------------------------
# Accurate live origin/destination and arrival time. The free route database only
# knows the route a flight number was last seen on, and airlines reuse numbers, so
# it is often wrong; with a key, routes come from the flight actually in the air.
# Set a key for ONE of them (if both are set, Flightradar24 is used). Lookups are
# billed, so CloudWall only asks about airliners heading for the house (from about
# 10 minutes out), each flight once, and keeps within the budget below. A Flightradar24
# route lookup costs 1 credit (2 if it finds a flight that has already landed).

[flightradar24]        # official Flightradar24 API (subscription with monthly credits)
api_key = ""           # your API token (or set CLOUDWALL_FR24_KEY)
monthly_credits = 0    # credits your plan includes each month (Explorer: 30000)
safety_margin = 0.15   # share of that held back and never used (0.15 = plan for 85%)
billing_day = 1        # day of the month your plan renews (1-28)
daily_limit = 0        # optional extra cap in credits per day (0 = none; without monthly_credits, 300)
mode = "always"        # "always": every airliner near the house (recommended); "fallback": only when the free route looks wrong
general_aviation = false   # also look up private aircraft; most have no route
sandbox = false        # true with a sandbox token: free, but returns fixed sample data

[flightaware]          # FlightAware AeroAPI (billed per lookup)
api_key = ""           # your AeroAPI key (or set CLOUDWALL_FLIGHTAWARE_KEY)
monthly_limit = 0      # same budget settings as above; without one, 30 lookups a day
daily_limit = 0
mode = "always"
general_aviation = false

[map]                  # faint map under the radar, cached on disk by CloudWall
style = "dark"         # "dark" or "light" grey street map, "satellite", "osm" (OpenStreetMap), or "off"
opacity = 0.32         # 0 to 1: how strongly the streets show under the radar
# Any other raster tile service, e.g. CARTO with your API key. Paste the provider's
# raster URL template; {z} {x} {y} (and {s} {r}) are filled in. The key stays on
# your server: the browser only ever loads tiles from CloudWall.
# CARTO Dark Matter without labels (CARTO wants the key as a "key" URL parameter):
# url = "https://basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png?key=YOUR_CARTO_KEY"
# attribution = "© OpenStreetMap contributors © CARTO"   # the credit the provider asks for

[logos]                # airline logos on the flight card, downloaded once per airline and cached
enabled = true
# url = "https://pics.avs.io/240/80/{iata}@2x.png"   # where logos come from ({iata} = airline code)

[extras]               # more free data, fetched only while a screen is open
military = true        # military jets heard nearby that send altitude but no position (adsb.fi)
military_radius_nm = 40
tfr = true             # temporary flight restrictions from the FAA, on the radar and Weather tab
tfr_radius_nm = 30
contrails = true       # contrail forecast from upper-air temperature and humidity (Open-Meteo)

[server]
host = "0.0.0.0"
port = 5050

[storage]
db_path = ""           # empty: ~/.local/share/cloudwall/cloudwall.db
