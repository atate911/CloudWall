# CloudWall settings. Every key is optional; these are the defaults.
# Restart CloudWall after editing.

[home]
name = "Home"
lat = 45.5900          # <-- set to your house (decimal degrees), east Vancouver, WA here
lon = -122.4740
# zip = "98683"        # or a US ZIP code instead of lat and lon: the centre of its area
# elevation_ft = 100   # feet above sea level; the airport's when left out

[airport]              # the local airport: arriving/departing labels, runways, weather
icao = "auto"          # the nearest large airport within 30 nm, else the nearest with airline service
                       # (PDX for Vancouver, WA); or its ICAO code. The rest comes from CloudWall's tables.
# Only for an airport the tables don't have (CloudWall says so when it starts):
# iata = "PDX"
# city = "Portland"
# lat = 45.5887
# lon = -122.5975
# Smaller fields nearby: light aircraft low over them are labelled as theirs, and they're
# marked on the radar. By default, the fields in CloudWall's tables within the tracking radius:
# around Vancouver, Pearson Field, Grove Field, Troutdale, Scappoose and Hillsboro. Listing any
# here replaces them; to add one CloudWall doesn't know, put it in cloudwall/data/fields.csv.
# [[airport.others]]
# code = "VUO"
# name = "Pearson Field"
# city = "Vancouver"
# lat = 45.6205
# lon = -122.6564
# elevation_ft = 25

[tracking]
radius_nm = 15         # how far out the board, flight card and logbook look; the radar can be set to 20 or 30
overhead_nm = 3.5      # inside this, an aircraft takes over the screen and is logged
max_overhead_alt_ft = 45000
poll_seconds = 5       # be kind to the free API; don't go below ~3
when_idle = "pause"    # when no screen has been open for idle_after_seconds:
                       #   "pause" makes no requests at all (the logbook misses flyovers meanwhile)
                       #   "log" checks the free position feed every 15 s so the logbook stays complete
                       # Either way, no paid route lookups and no weather while nobody is looking.
idle_after_seconds = 90

[source]               # position feeds (readsb-style JSON), tried in order with automatic failover
urls = [
  "https://opendata.adsb.fi/api/v3/lat/{lat}/lon/{lon}/dist/{radius}",
  "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}",
]
merge = false          # true: the first url is your own ADS-B receiver (e.g. "http://<pi>:8080/data/aircraft.json"),
                       # asked every update alongside the public feeds after it, and the two combined:
                       # every aircraft either sees, your receiver's fresher position where both see one,
                       # each moved on along its track to the same moment so a lagging feed never pulls
                       # an aircraft backwards. The public feeds after it still fail over in order.

# --- Optional paid route providers -------------------------------------------------
# Accurate live origin/destination and arrival time. The free route database only
# knows the route a flight number was last seen on, and airlines reuse numbers, so
# it is often wrong; with a key, routes come from the flight actually in the air.
# Set a key for ONE of them (if both are set, Flightradar24 is used). Lookups are
# billed, so CloudWall only asks about airliners heading for the house (from about
# 10 minutes out), each flight once, and keeps within the budget below. A Flightradar24
# route lookup costs 1 credit (2 if it finds a flight that has already landed).

[flightradar24]        # official Flightradar24 API (subscription with monthly credits)
api_key = ""           # your API token (or set CLOUDWALL_FR24_KEY)
monthly_credits = 0    # credits your plan includes each month (Explorer: 30000)
safety_margin = 0.15   # share of that held back and never used (0.15 = plan for 85%)
billing_day = 1        # day of the month your plan renews (1-28)
daily_limit = 0        # optional extra cap in credits per day (0 = none; without monthly_credits, 300)
mode = "always"        # "always": every airliner near the house (recommended); "fallback": only when the free route looks wrong
general_aviation = false   # also look up private aircraft; most have no route
sandbox = false        # true with a sandbox token: free, but returns fixed sample data

[flightaware]          # FlightAware AeroAPI (billed per lookup)
api_key = ""           # your AeroAPI key (or set CLOUDWALL_FLIGHTAWARE_KEY)
monthly_limit = 0      # lookups your plan allows each month (the same budget settings as above);
                       # without one, 30 lookups a day
safety_margin = 0.15
billing_day = 1
daily_limit = 0
mode = "always"
general_aviation = false

# More places to watch, such as a cabin: each needs a name and lat and lon, or a ZIP code. The
# airport is chosen as for [airport] unless given. The desktop can also add places (see the menu
# beside "CloudWall"), and each screen can show a different one. Every place keeps its own
# logbook, and data is fetched only for places a screen is showing.
# [[places]]
# name = "Cabin"
# zip = "97702"        # or lat = 44.0600 and lon = -121.3100
# airport = "KRDM"     # optional: "auto" when left out
# elevation_ft = 3600  # optional: the airport's when left out

[kiosk]                # the wall panel (/kiosk) has no buttons, so its place and radar are set here
place = ""             # a place's name; empty for [home]
view = "card"          # "card": the aircraft overhead across the whole screen; "radar" puts the radar
                       # beside it, "map" the flights on an everyday satellite map, "sky" a dome
                       # of the sky above home with the aircraft overhead crossing it
radar = "chart"        # "chart", or "atc" to draw the radar like an air traffic control screen
tracks = true          # the selected aircraft's track and lines to where aircraft will be in a minute
range_nm = 0           # 0 for the tracking radius above, or 20 or 30 to see further
density = "simple"     # the radar's labels: "simple" names the aircraft that matter, "detailed" every one
quiet = ""             # quiet hours, e.g. "23:00-06:30": only a dim clock and what's next, waking for
                       # something coming over the house, something new worth a look, an emergency
                       # or a tap; "" for none

[map]                  # the maps under the radar, cached on disk by CloudWall
style = "dark"         # the Chart-style radar's map: "dark" or "light" grey street map, "satellite",
                       # "osm" (OpenStreetMap), an FAA chart ("sectional", "terminal", "ifr-low",
                       # "ifr-high"), or "off"
opacity = 0.45         # 0 to 1: how strongly the map shows under the radar
route = "satellite"    # the map behind the flight's route on its card: "satellite", "light" or "dark"
                       # grey, "osm", or "off" for the plain arc
atc = "off"            # a chart under the ATC-style radar: "off" (a controller's screen has only
                       # its video map), or "ifr-low" (IFR Enroute Low), "ifr-high", "sectional", "terminal"
cache_mb = 2000        # the most disk the downloaded map and chart tiles may take, all together;
                       # the oldest are removed once a day to stay under it (0: no limit)
# Any other raster tile service, e.g. CARTO with your API key. Paste the provider's
# raster URL template; {z} {x} {y} (and {s} {r}) are filled in. The key stays on
# your server: the browser only ever loads tiles from CloudWall.
# CARTO Dark Matter without labels (CARTO wants the key as a "key" URL parameter):
# url = "https://basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png?key=YOUR_CARTO_KEY"
# attribution = "© OpenStreetMap contributors © CARTO"   # the credit the provider asks for

[logos]                # airline logos on the flight card, downloaded once per airline and cached
enabled = true
# url = "https://pics.avs.io/240/80/{iata}@2x.png"   # where logos come from ({iata} = airline code)

[extras]               # more free data, fetched only while a screen is open
military = true        # military jets heard nearby that send altitude but no position (adsb.fi)
military_radius_nm = 40
tfr = true             # temporary flight restrictions from the FAA, on the radar and Weather tab
tfr_radius_nm = 30
contrails = true       # contrail forecast from upper-air temperature and humidity (Open-Meteo)

[server]
host = "0.0.0.0"
port = 5050
# A private link, for reaching CloudWall from outside the house (a car's browser, a phone away from
# home) without opening it to everyone who finds the address. With a key set, CloudWall answers
# only at <its address>/k/<key>/ and tells any other request nothing: open that link once on each
# screen and keep it as a bookmark or favourite (the wall panel's is .../k/<key>/kiosk). The key is
# typed with or without its hyphens. `cloudwall --private-link` (or `make private-link`) makes one
# that is easy to type and hard to guess, writes it here, restarts the service and prints the links;
# one of your own needs at least 12 letters and digits. Leave it out on a home network.
# key = "tafo-kemi-luza-nobe"

[storage]
db_path = ""           # empty: ~/.local/share/cloudwall/cloudwall.db
