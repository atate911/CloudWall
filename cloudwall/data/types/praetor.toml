text = """
Embraer launched the Legacy 500 in 2008 as the first jet of its size with full fly-by-wire controls
and a flat-floored cabin passengers can stand up in. The pilots fly it with sidesticks, as in an
Airbus, and two Honeywell HTF7500E turbofans hang on the rear fuselage. The Legacy 450 is the same
aircraft 4 ft shorter, with 95% of its systems in common. Fuselages come from Botucatu in Brazil and
wings from Évora in Portugal, and since 2016 some have been assembled in Melbourne, Florida, beside
the Phenoms.

In 2018 the pair became the Praetor 500 and 600, with larger winglets and more range, 3,340 nm for
the 500 and 4,018 nm for the 600, and a Legacy 450 can be brought up to Praetor 500 standard. The
Praetors have outsold the Legacy 450 and 500 they replaced; as of 2026 more than 300 have been
delivered, the 500 and 600 in nearly equal numbers.
"""

