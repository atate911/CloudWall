text = """
Cessna launched the CitationJet in 1989 to bring back the formula that had sold its first Citation,
a small straight-winged jet docile enough for its owner to fly alone from short runways, but faster
and cheaper to run. It kept the Citation I's round fuselage, 58 inches across inside, with a new
wing carry-through that did away with the step the spar had made in the aisle. The wing is a
natural-laminar-flow section developed with NASA, holding laminar flow over 30% of its upper
surface, and to preserve that it is kept clear of ice by hot engine air instead of rubber boots. Its
engines were the first production Williams FJ44s, from a company until then known for the little
turbofans in cruise missiles and drones.

Cessna has stretched it three times: the CJ2 in 2000, the CJ3 in 2004, and in 2010 the CJ4, with a
swept wing derived from the bigger Citation Sovereign's and engines of nearly twice the original's
thrust. In 2013 the CJ1 became the M2, with small winglets and a Garmin glass cockpit. Every one can
be flown by a single pilot, and more than 2,000 had been delivered by 2017. The early CitationJets
have no thrust reversers; two paddles behind the engines swing into the exhaust instead, as on
Cessna's T-37 jet trainer. Otherwise the family looks much alike, small T-tailed jets with the
engines high on the rear fuselage, and the CJ4's swept wing and the M2's winglets are the giveaways.
"""

