[variants.MI14]
name = "Mil Mi-14"
production = [1973, 1986]
more = """
The Mi-14 is the Mi-8's amphibious cousin, built for the Soviet Navy to hunt submarines from bases
on shore. It has a boat hull like the Sea King's, a search radar under the nose, a watertight
weapons bay for a torpedo or depth charges, and landing gear that retracts, the first on any
Soviet helicopter, its main wheels folding into sponsons at the back. It first flew in 1967 and
entered service in 1976, and Kazan built them from 1973 to 1986.
"""
[variants.MI14.facts]
