text = """
Mikhail Mil's bureau flew the first prototype in 1961, and in 1963 a later one traded its
four-bladed rotor for five blades to cut vibration; every Mi-8 since has had five. Its two
turboshafts sit above the cabin, which takes 24 troops or 12 stretchers and
opens at the back through clamshell doors, on some later models a ramp. It has been built at Kazan
and Ulan-Ude, and under licence in China, and flown by armed forces and civil operators in dozens
of countries; its maker calls the Mi-8 and Mi-17 the most widely operated helicopter in history.

The second generation, the Mi-8M series that Russia exports as the Mi-17, took the more powerful
Klimov TV3-117 engines, rotors and transmission developed for the Mi-14, and moved the tail rotor
from the right side of the tail to the left, where its blades rise into the main rotor's
downwash, which gives the pilot more yaw control. That is the quickest way to tell them apart: an
Mi-17 has its tail rotor on the left, dust shields in front of its engine intakes, and oval
exhausts where the Mi-8's are round.
"""

[facts]
"Engines" = "2 × Klimov TV2-117 (Mi-8); TV3-117 or VK-2500 (Mi-17)"

