text = """
"Neo" stands for new engine option, and the engines are most of the story: Pratt & Whitney's geared
PW1100G or CFM's LEAP-1A, with fans of about 2 m against the older A320's 1.6 to 1.7 m, pushing
eleven to twelve and a half times as much air around the core as through it. With the sharklets, the
tall curved winglets the family now carries, they cut fuel burn by around 15%, or 20% a seat in the
denser cabins Airbus offers with it. The Pratt engine puts a gearbox between fan and turbine so each
can turn at its best speed; from 2023 contaminated powdered metal in its turbine discs kept hundreds
of neos on the ground for inspection.

From below, the engines fill noticeably more of the space under the wing than an older A320's, and
the neo doesn't whistle on approach as the early ones did. Together with the original family it has
outsold every other airliner, the 737 included, passing it in orders in 2019 and in deliveries in
2025.
"""

[facts]
"Entered service" = "January 2016"
"Engines" = "2 × Pratt & Whitney PW1100G or CFM LEAP-1A"

[variants.A19N]
name = "Airbus A319neo"
[variants.A19N.facts]
"Range" = "3,700 nm (6,850 km)"
"Max takeoff weight" = "up to 75,500 kg"

[variants.A20N]
name = "Airbus A320neo"
[variants.A20N.facts]
"Range" = "3,400 nm (6,300 km)"
"Max takeoff weight" = "up to 79,000 kg"

[variants.A21N]
name = "Airbus A321neo"
more = """
The A321neo is the family's best seller, and its long-range versions take it across the Atlantic.
The XLR carries an extra fuel tank built into the fuselage and reaches about 8,700 km.
"""
[variants.A21N.facts]
"Range" = "4,000 nm (7,400 km); XLR 4,700 nm (8,700 km)"
"Max takeoff weight" = "up to 97,000 kg; XLR 101,500 kg"
