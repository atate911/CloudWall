[variants.A20N]
name = "Airbus A320neo"

[variants.A21N]
name = "Airbus A321neo"
more = """
The A321neo is the family's best seller, and its long-range versions have put single-aisle jets on
routes across the Atlantic. The XLR carries an extra fuel tank built into the fuselage and reaches
about 8,700 km.
"""
