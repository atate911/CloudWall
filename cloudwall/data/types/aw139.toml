text = """
Agusta launched it in 1997 to replace the Huey and its twin-engined descendants, and brought Bell
in a year later, aiming at an empty space between the Bell 412 and the much bigger Super Puma and
S-92. Bell pulled out in 2005, the AB139 became the AW139, and more than 1,200 had been built by
2024. Two Pratt & Whitney Canada
PT6C-67Cs under full-authority digital control handle an engine failure on their own, with barely a
twitch; five composite blades turn on a titanium hub; and the wheels retract, the main gear into
sponsons that also hold emergency equipment. The cabin, which Leonardo calls the largest in its
class, seats 15 in three rows of five, and its range and room made it a favourite for crew changes
on offshore oil and gas platforms.

Rescue services took to it as well: the Irish Air Corps became its first military operator in
2006, the Japan Coast Guard replaced its Bell 212s with it, and Britain's coastguard flies it
alongside the bigger AW189 and the S-92. In a 2015 test its main gearbox ran for an hour with no oil. The US Air
Force's version, Boeing's MH-139A Grey Wolf, is replacing the UH-1N in guarding its Minuteman missile
fields and flew its first operational mission in January 2026. Know it by the sponsons either side
of the cabin, where its wheels fold away, and its five blades; the AW189 looks like a larger copy.
"""

