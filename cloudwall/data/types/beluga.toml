text = """
Airbus builds its aircraft in pieces across Europe, wings in Britain, fuselage sections in Germany
and France, tails in Spain, and flies the pieces to its final assembly lines. Until the 1990s it
used Super Guppies, 1940s Boeing Stratocruisers rebuilt with bulbous fuselages, and the joke went
that every Airbus was delivered on the wings of a Boeing. Their replacement, first flown in 1994,
was an A300-600 with a hold 7.1 m across built on top and the cockpit moved down below the cargo
floor, so the whole nose could swing up for loading without disconnecting the flight controls,
hydraulics and wiring. That halved loading times, and the five Belugas carried Airbus's parts for a
third of what the Guppies had cost.

The hold has more room than a C-5's or an An-124's, though the Beluga can lift only 47 tonnes, and
most A380 fuselage sections were still too big for it. Its successor, the BelugaXL, is built on the
A330-200 and entered service in January 2020. It is 6.9 m longer and 1.7 m wider than the original
and carries two A350 wings where the Beluga took one. Six XLs had taken over Airbus's own flights by
2023, and as of 2026 the original Belugas are being retired, the last expected to go in 2027.
"""

