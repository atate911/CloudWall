text = """
Built as a flying crane, the Skycrane has almost no fuselage: a narrow spine joins the cockpit to
the tail on legs tall enough for a load to be winched up tight beneath it, where it can't swing
like a pendulum in forward flight, and the gear kneels to make loading easier. At the back of the
cockpit a seat faces aft, with its own controls, so that a pilot can fly the load while watching
it. Its two Pratt & Whitney turboshafts were adapted for it from the JT12 jet engine and turn a
six-bladed rotor. As the US Army's CH-54
Tarhe, from 1963, it recovered more than 380 downed aircraft in Vietnam, and in 1965 one lifted 90
people at once in a detachable pod.

Erickson, of Central Point, Oregon, bought its first three in 1971 and the type certificate from
Sikorsky in 1992, and calls it the Aircrane. For firefighting it carries a 2,650-gallon tank, which
it refills in 45 seconds through a snorkel 18 inches across while hovering over water, and each
one has a name: Elvis, which has fought bushfires in Australia, got its from time spent in
Memphis. Another, Olga, flew the antenna onto Toronto's CN Tower in 36 pieces in 1975, in three
and a half weeks instead of the six months planned. In 2024 Erickson sold its firefighting
division and all its Aircranes to Helicopter Express.
"""

