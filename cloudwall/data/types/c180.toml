text = """
The taildraggers the 172 and 182 grew from: the 172 began as a 170 on a nosewheel, and the 182 as a
180 on one. The 170 of 1948 was a four-seat development of the two-seat 140 with a 145 hp
Continental, and the 170B of 1952 brought in the wing whose planform the 172, 182 and 206 still use:
constant in chord out to the end of large slotted flaps, adapted from the Army's L-19 Bird Dog, a
military derivative of the 170, and tapered beyond. The 180 of 1953 put a 225 to 230 hp Continental
O-470 into a heavier airframe, and the 185 of 1961, strengthened again and with a bigger fin, took
260 hp and then 300.

The 180 and 185 are widely flown as bush planes, mostly in Alaska and Canada, carrying people and
freight into rough strips, lakes and snowfields on wheels, floats or skis, and when Cessna went back
to building singles in the 1990s it left them out. A 170 has a rounded fin, the 180 and 185 a
squared one. Telling a late 180 from a 185 is harder: from 1964 the 180 has the 185's fuselage, with
three side windows instead of two, and from 1977 its larger dorsal fairing too.
"""

