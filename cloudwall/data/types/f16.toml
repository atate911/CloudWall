text = """
The F-16 was the product of a revolt inside the Pentagon: John Boyd and the "Fighter Mafia" argued,
from his energy-manoeuvrability theory, that a small, light fighter with more thrust than weight
would beat the big, costly ones, and in 1975 General Dynamics' YF-16 won the contest against
Northrop's YF-17, which the Navy went on to develop into the Hornet. It was the first production
fighter designed to be slightly unstable, which cuts drag and sharpens its response, and it is
flown entirely through four channels of fly-by-wire, with no mechanical link at all from the stick
to the control surfaces; pilots called it "the electric jet". In January 1974, during a fast taxi
test, the prototype began to rock and veer off the runway, and test pilot Phil Oestricher chose to
take off rather than risk a crash, so its first flight, six minutes long, was unplanned.

The specification asked for 7.33 g; General Dynamics built it for 9 g on full internal fuel, the
first fighter designed for that from the start. The pilot sits under a frameless bubble canopy in a
seat tilted back 30 degrees, which raises g tolerance, and flies with a side-stick on the armrest
that at first didn't move at all, sensing only pressure, until pilots' complaints won it a little
play. Tell it by the single fin and the intake slung under the cockpit like an open mouth. Its
crews call it the Viper, partly after the starfighters of Battlestar Galactica, on television when
it entered service. More than 4,600 have been built, Lockheed Martin still builds it in Greenville,
South Carolina, and as of 2026 it is the most numerous fixed-wing military aircraft in service. The
Thunderbirds have flown it since 1983.
"""

