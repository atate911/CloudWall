text = """
About half the airframe by weight is carbon composite, and only a fifth is aluminium. The fuselage is
wound as one-piece barrels instead of riveted aluminium sheet, and because composite doesn't fatigue
like metal, the cabin can be pressurised to a 6,000 ft altitude rather than the usual 8,000, with
more humid air. The windows are 27 by 47 cm, the largest of any widebody flying, with no shades.
Passengers dim them electronically.

It is also the first airliner to give up almost all the compressed air that engines usually supply.
Pressurisation, wing de-icing and engine start run on electricity instead, from six generators
rated at 1,450 kVA in all. The wings are long and flexible enough that in flight the tips ride well
above where they sit at the gate. They sweep back to a point with no winglet, and the engine
nacelles end in a saw-tooth edge that softens the jet noise.
"""

