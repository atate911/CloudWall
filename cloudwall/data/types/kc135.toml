text = """
Every KC-135 was built between 1956 and 1965, so each is older than most of the crews who fly it,
and as of 2026 about 375 still serve with the US Air Force. It grew from the same Boeing prototype
as the 707 but with a narrower fuselage. From 1984 most were re-engined with the CFM56-2, the first
of the engine family that went on to power the 737 Classic and the A320. The new engines made them
quieter and stronger and let them offload up to 50 percent more fuel; those are the KC-135R and T.

Fuel goes mostly through a flying boom under the tail, steered into the receiving aircraft by a boom
operator lying on their front at a window in the tail. From the ground it looks like an early
four-engined airliner with very large engines, in grey, with the boom raised beneath the fin.
"""

