text = """
Piper's answer to the Cessna 172, and the other aircraft generations of pilots learned on: a low-wing
four-seater, in production since 1961, with more than 32,000 built as the Cherokee, Warrior, Archer,
Dakota and the retractable-gear Arrow. The early ones have a constant-chord "Hershey bar" wing; from
the 1970s most have a longer, tapered wing that is easier to land smoothly.

With the wing below, a Piper hides less of the sky from its pilot when turning than a high-wing
Cessna, and the trade-off is a single door on the right side, over the wing. You can tell a PA-28
from a Cessna 172 at once by where the wing is.
"""

