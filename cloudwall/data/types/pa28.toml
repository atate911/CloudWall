text = """
Piper's answer to the Cessna 172, and the other aircraft generations of pilots learned on: a low-wing
four-seater, in production since 1961, with more than 32,000 built as the Cherokee, Warrior, Archer,
Dakota and the retractable-gear Arrow. The early ones have a constant-chord "Hershey bar" wing; from
the Warrior of 1974, Piper moved them to a longer, semi-tapered wing, meant to improve their
handling at the stall.

With the wing below, its pilot can see the traffic above that a Cessna's wing would hide, but less
of what is below. There is one door, on the right, reached by stepping up onto the wing. You can tell a PA-28 from a Cessna 172 at once by where the wing is.
"""

