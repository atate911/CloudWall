text = """
A strategic airlifter built to bring heavy loads across an ocean and land them close to the front,
on a strip as short as 3,500 ft, even an unpaved one. Its four Pratt & Whitney F117s are military
versions of the 757's PW2000, and their exhaust blows onto large flaps to make extra lift at low
speed. On the ground it can reverse its engines and back itself up a 2 percent slope fully loaded.

279 were built before the line closed in 2015, most for the US Air Force, the rest for the RAF,
Australia, Canada, India, Qatar, the UAE, Kuwait and a twelve-nation unit in Hungary. It is
unmistakable from below: a high wing with winglets, four engines, a T-tail and a fat grey fuselage
with bulges along its sides for the landing gear.
"""

