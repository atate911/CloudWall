text = """
For the G650 Gulfstream gave up the usual round fuselage for an oval one, flatter in its lower half
to make better use of the cabin, with panels bonded together rather than riveted. Its wing has no
slats on the leading edge, and the flap tracks are hidden inside the wing's profile. It was the
second business jet with fly-by-wire controls, after the Dassault Falcon 7X, and is good for Mach
0.925; in testing one dived to Mach 0.995. Its oval windows are 28 in wide, and there are eight a side
on it and the G800 and ten on the stretched G700, the quickest way to tell them apart. The design won
the Collier Trophy for 2014.

The extended-range G650ER carries 4,000 lb more fuel in the same wing, and in 2019 one flew 8,379 nm
nonstop from Singapore to Tucson, taking back from the Global 7500 the record for a purpose-built
business jet. The G700, delivered from 2024, is 10 ft longer, with Rolls-Royce Pearl 700 engines,
wider winglets and the sidestick, touch-screen cockpit of the G500 and G600. The G800 of 2025 pairs
the G650's length with the G700's engines and winglets, flies 8,200 nm and has replaced the G650 in
production. Both reach Mach 0.935, the fastest of any Gulfstream.
"""

