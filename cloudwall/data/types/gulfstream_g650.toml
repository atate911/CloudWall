more = """
In April 2011 the second test aircraft crashed at Roswell, New Mexico, during a takeoff test with one
engine throttled back to simulate a failure: it lifted off at too high an angle, stalled, and its
right wingtip hit the runway, killing the four Gulfstream employees on board. The NTSB found that
Gulfstream had pursued a takeoff safety speed that was too low, and it was raised from 135 to 150 kt.
"""
