text = """
Cessna's largest jet takes the Latitude's round, flat-floored fuselage, strengthened and stretched
by a row of seats, and sets it on a new wing swept at about 28°, with winglets, and a T-tail; wing
and tail resemble the Hawker 4000's. The engines are Honeywell HTF7700Ls of 7,665 lb thrust each, in
place of the French Snecma Silvercrest it was first meant to have, and they carry it 3,500 nm.

Announced in 2012 for service in 2017, it first flew in October 2016, but the testing needed for
certification doubled, and the FAA certified it only in September 2019, after 6,000 hours of flight
tests and a 31,000 nm tour round the world. NetJets took its first on the last day of that year, and
the 100th was delivered in May 2023. Next to a Latitude it is longer, with a more sharply swept wing
and the tailplane on top of the fin.
"""

