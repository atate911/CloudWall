text = """
Bölkow's Bo 105, first flown in 1967, was the first light twin-engined helicopter, and its rotor set
it apart. It has no flapping or lead-lag hinges: the four glass-fibre blades bolt to a solid
titanium hub and bend instead, which is mechanically simpler and passes the rotor's forces straight
into the airframe, so it answers the controls quickly and has none of the mast bumping that limits
teetering rotors. It was the first helicopter that could fly aerobatics, loops and rolls included,
cleared by MBB for 3.5 g and 1 negative, and Red Bull has flown one in displays.

It entered service in 1970 with ADAC Air Rescue and the Bavarian police, and clamshell doors at the
back of the short cabin took a stretcher, so it spread through air ambulance services. The German
Army flew 212 armed with HOT anti-tank missiles as the PAH-1, and retired its last Bo 105s in 2016.
About 1,640 were built, many under licence in Canada, Spain, Indonesia and the Philippines, before
Eurocopter ended production in 2001 in favour of the EC135, which began as the Bo 108. Its hingeless
rotor went on to the BK 117.
"""

