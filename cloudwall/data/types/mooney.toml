text = """
Al Mooney's twentieth design, a low-wing four-seater built to go fast on little power. The first
M20s of 1955, with wooden wings and tail, reached 170 mph on a 150 hp Lycoming. Ralph Harmon, who
had led the design of the Beech Bonanza, made it all-metal from 1961, and the M20J of 1977 was sold
as the 201, for the 201 mph it made on 200 hp once Roy LoPresti's engineers had closed the wheel
wells with doors, faired in the flap hinges and made the access panels flush. Under the aluminium skin the cabin is a
steel-tube cage, the main gear hangs from the wing spar on stacks of rubber discs, and early ones
raise their wheels by hand with a lever called the Johnson bar, a name Mooney brought from the
steam locomotives of his railway years.

It is easy to pick out by its tail: the fin has a vertical leading edge, so it seems to lean
forward, and the whole tail pivots to trim the aircraft in pitch. Mooney stretched the fuselage
twice, into short, medium and long bodies, and turbocharged it from the M20K 231 of 1979, named
like the 201 for its top speed in mph, to the Acclaim of 2006, the fastest single-engine piston
production aircraft of its day, whose Type S reached 242 knots. More than 11,000 were built, in
three runs broken by the company's money troubles; the last ended in 2019.
"""

