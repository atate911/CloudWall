text = """
The twin-engined light helicopter of air ambulances and police forces, first flown as the Eurocopter
EC135 and built since 1996, with more than 1,500 delivered. Its tail rotor is a Fenestron, a
many-bladed fan set in a duct in the tail fin, which is safer for people on the ground and quieter
than an open rotor. Clamshell doors at the back of the cabin let a stretcher slide straight in.

You can know it by the ring in its tail, the twin engine exhausts on top and the rounded nose. Its
two engines, Turbomeca Arriels or Pratt & Whitney Canada PW206s, let it keep flying if one fails,
which is what lets it land on hospital roofs and city streets.
"""

