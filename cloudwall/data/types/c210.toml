text = """
The 210 went on sale in 1960 as a Cessna 182 with retractable gear, a swept tail and a new wing,
and Cessna went on reworking it until 1986. Its main wheels fold back into the fuselage behind the
passengers. For 1964 Cessna fitted two child seats into that space; for 1970 it gave the main gear
longer, tapered steel-tube legs that tuck the wheels further back, which made room for full-size
seats and made the 210K the first true six-seater. From 1979 the gear doors were left off, the legs
lying in shallow channels under the belly, and most older 210s have since had theirs removed too,
because they were troublesome to maintain.

From 1967 the wing has no strut: a big high-wing Cessna with nothing bracing its wing and its
wheels tucked away is a 210, the smaller Cardinal aside. The turbocharged T210 arrived in 1966 and
the pressurised P210 in 1978, with four windows down each side. That cantilever wing's spar
carry-through has become the type's ageing problem: in 2019 a T210M lost its right wing near Mount
Isa, Australia, to a fatigue crack that had grown from a small corrosion pit, and in 2020 the FAA
made eddy-current inspections of the carry-through mandatory.
"""

