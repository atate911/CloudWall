text = """
The 182 is to the 180 what the 172 is to the 170: the same airframe on a nosewheel, introduced in
1956. It has the 172's wing planform and its 174 sq ft of area, but where a 172 has a four-cylinder
engine the 182 has a 230 hp six, a Continental O-470 until 1986 and a fuel-injected Lycoming IO-540
since production restarted in 1997, turning a constant-speed propeller. With that power it lifts
far more: its maximum takeoff weight has grown from 2,550 lb in 1956 to 3,100 lb, where a 172S stops at
2,550. The deluxe version of 1958 was the first called the Skylane, a name every 182 has carried
since 1976.

Skydiving operators fly it with the passenger seats out, an upward-opening door and a big step
outside it, and the Civil Air Patrol flies it on search and rescue. From 1978 to 1986 Cessna also
built it with retractable gear, raised by an electrically driven hydraulic pump, as the Skylane RG,
which cruised at 156 knots at 7,500 ft on 75% power, and the turbocharged T182 followed in 1981. From below it
is hard to tell from a 172; it is nearly two feet longer, with a bigger nose for its six-cylinder
engine.
"""

