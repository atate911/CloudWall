text = """
The 182 is to the 180 what the 172 is to the 170: the same airframe on a nosewheel, introduced in
1956. It has the 172's wing planform and its 174 sq ft of area, but where a 172 has a four-cylinder
engine the 182 has a 230 hp six, a Continental O-470 until 1986 and a fuel-injected Lycoming IO-540
since production restarted in 1997, turning a constant-speed propeller. With that power it lifts far
more: its maximum takeoff weight has grown from 2,550 lb in 1956, what a 172S is allowed today, to
3,100 lb. The deluxe version of 1958 was the first called the Skylane, a name every 182 has carried
since 1976.

Skydiving operators fly it with the passenger seats out, an upward-opening door and a big step
outside it, and the Civil Air Patrol flies it on search and rescue. The turbocharged T182 came in
1981, and from 1978 to 1986 there was also the Skylane RG, its wheels raised by an electrically
driven hydraulic pump, which cruised at 156 knots at 7,500 ft on 75% power. From below it is hard to
tell from a 172; it is nearly two feet longer, with a bigger nose for its six-cylinder engine.
"""

