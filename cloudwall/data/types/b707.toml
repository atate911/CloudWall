text = """
In 1952 Boeing's board put $16 million of the company's own money, nearly all it had earned since
the war, into a jet prototype, the 367-80. The Dash 80 led to the Air Force's KC-135 and, as a
separate design, the 707, whose cabin was widened to 148 inches so airlines could seat six abreast
and match the DC-8; the 727, 737 and 757 kept that cross-section. In 1955 test pilot Tex Johnston
barrel-rolled the prototype in a demonstration over Lake Washington, and was told not to do it
again. Pan Am flew the first 707 service, New York to Paris with a fuel stop at Gander, in October
1958, and within a few years jets had taken the long-distance traveller from ships and trains.

Its wing, swept back 35 degrees, brought Dutch roll, a rocking mix of yaw and roll, to pilots raised
on straight-winged propliners; on one acceptance flight a trainee made it so violent that three
engines tore off a new Braniff 707. A taller fin, a boosted rudder and, on early models, a fin under
the tail tamed it. From the ground it is almost the twin of the DC-8, but its wing is swept further
back. Boeing built 856 707s, the last few as military airframes; airline passenger service ended in
Iran in 2013, and the last civil 707, a cargo flight, crashed there in 2019.
"""

