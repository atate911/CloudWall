text = """
Cessna's first twin since the wartime T-50 Bobcat, first flown in January 1953, and the start of
the family of Cessna twins that carry fuel in tanks on their wingtips. On the early 310s the tip
tanks held all of it; tanks inside the wing came only with the 310L of 1967. The exhaust first left
through augmenter tubes behind the engines, meant to turn it into a little extra thrust, but they
were loud, and from 1964 it was piped under the wing instead. The 310D of 1960 brought the swept
fin, the 310G of 1962 the canted "Stabila-Tip" tanks that went on to most of Cessna's twins, and the
last, the 310R, a longer nose with a baggage locker in it.

It was fast for a piston twin and could lift a ton of useful load, so air-taxi firms took to it,
and the US Air Force bought 196 as the L-27, later the U-3, known as the Blue Canoe. On television
it was Sky King's Songbird: a 310B lent free by Cessna and flown for the cameras by the company's
own 310 sales manager. More than 6,000 310s and 320s were built, and the tip tanks and swept fin
still pick one out at a glance.
"""

[facts]
