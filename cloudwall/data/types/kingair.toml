text = """
The best-selling business turboprop there is, built continuously since 1964, with more than 7,500
delivered across the family. Two Pratt & Whitney Canada PT6s and a pressurised cabin let it fly
higher and faster than piston twins while using strips too short for most jets, and it serves
everyone from charter firms to air ambulances. The US military flies the 200 and 350 as the C-12
Huron, and until 2025 flew the 350 as the MC-12 surveillance aircraft.

The 90 and the 100 have a conventional tail; the F90, the 200, the 300 and the stretched 350 have a
T-tail, which tells them apart at a glance. All have the PT6's stubby exhaust stacks just behind the
propellers, because the engine runs backwards: air is ducted round to the rear of the engine, flows
forward through the compressor and turbines, and leaves near the front.
"""

