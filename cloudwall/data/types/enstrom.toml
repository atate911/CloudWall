[variants.EN48]
name = "Enstrom 480"
production = [1993]
more = """
The 480 began as the TH-28, Enstrom's entry when the US Army wanted a new turbine training
helicopter: a 280 with a bigger cabin and a Rolls-Royce (Allison) 250 turbine. The Army didn't buy
it, but Enstrom put it on sale in 1993, and Japan's ground forces train on it. The engine can make
420 shp but is held to 305, so it has its full rated power up to 13,000 ft on a standard day, and
the rotor and hub weigh 300 lb, enough stored energy to make an autorotation uneventful. Unusually
for a helicopter, the pilot sits on the left.
"""
