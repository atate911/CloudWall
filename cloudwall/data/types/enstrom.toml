text = """
Rudy Enstrom, a mining engineer in Michigan's Upper Peninsula, set out to build a helicopter of his
own, and local businessmen were impressed enough to hire trained engineers and form a company around
him in 1959. Its F-28 was certified in April 1965, by which time Enstrom himself had been pushed out,
though the helicopters still carry his name. The company's hallmark is the rotor head: the links
that change the pitch of the three blades run inside the hollow mast instead of outside it, which
cuts drag and leaves the head clean, and most of the piston models since the F-28C of 1975 have a
turbocharged Lycoming HIO-360.

F. Lee Bailey, the criminal defence lawyer, bought the company in 1971, soon had it building more
than a hundred helicopters a year, and brought out the 280 Shark, a streamlined F-28 that sold at
once; its 280FX version is the one with fins at the ends of the tailplane. Later owners included
Victor Kiam, Dean Kamen, who developed the Segway, and from 2013 a Chinese investor. Enstrom went
bankrupt in January 2022, was bought that May, and flew its first new helicopter in January 2023.
"""

