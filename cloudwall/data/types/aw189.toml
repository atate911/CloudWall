text = """
An eight-tonne twin that Leonardo calls "super-medium", built for the long flights out to offshore
platforms and for search and rescue. It is the civil version of the military AW149, itself an
enlarged AW139, and flew in December 2011. It seats up to 19, has two GE CT7-2E1s of 2,000 hp each,
or Safran Aneto-1Ks of 2,500 hp on the AW189K for hot and high work, and a main gearbox designed to
keep turning for 50 minutes after losing its oil, more than the rules require.

Bristow launched it in 2014 to replace its Super Pumas offshore, and from 2015 flew it with S-92s
for Britain's coastguard, taking search and rescue over from the RAF and the Royal Navy; Bristow
also flies it for the Irish and Dutch coastguards. From the ground it looks like an AW139 grown
larger, with the same five-bladed rotor and wheels that fold away.
"""

[facts]
"First flight" = "December 2011"
"Max takeoff weight" = "8,300 kg (18,300 lb)"
"Engines" = "2 × GE CT7-2E1; Safran Aneto-1K on the AW189K"

[variants.A149]
name = "Leonardo AW149"
more = """
The AW149 came first, revealed in 2006 as a rival to the Black Hawk and flown in November 2009, but
Leonardo put the civil AW189 ahead of it for most of the 2010s. It carries up to 15 troops on
crashworthy seats, with self-sealing fuel tanks behind the cabin so the floor can sit low. Thailand
was its first export customer, Egypt's navy ordered 24 in 2019, Poland 32 in 2022, built at Świdnik, and
in 2026 Britain signed for 23, to be built at Yeovil to replace the RAF's Pumas.
"""
[variants.A149.facts]
"First flight" = "November 2009"
"Max takeoff weight" = "8,600 kg (18,960 lb)"
"Engines" = "2 × GE CT7-2E1 or Safran Aneto-1K"
