text = """
Designed as Vietnam showed American fighters struggling in the close-in fight, the F-15 was built
around a simple idea: more thrust than weight. Its two Pratt & Whitney F100s let it accelerate going
straight up, and in 1975 a stripped F-15, the Streak Eagle, climbed from a standing start to 30,000 m
in under three and a half minutes. In air-to-air combat, flown by the US, Israel and Saudi Arabia, it
has more than 100 victories and no losses.

Its wide fuselage makes so much lift, and its engines so much thrust, that in 1983 an Israeli F-15D
landed after losing most of its right wing in a mid-air collision. You can tell it by its twin
upright fins, square intakes either side of the cockpit and a wing that looks too big for the jet.
The Air National Guard keeps F-15s on 24-hour alert at a few US bases, ready to launch within
minutes to meet an aircraft that won't answer.

Two later versions are built with a second seat behind the pilot. The F-15E Strike Eagle, a dual-role
version built for ground attack without giving up the Eagle's air-to-air ability, has conformal fuel
tanks fitted flat along the sides of its intakes. The F-15EX Eagle II, derived from it, adds
fly-by-wire controls and GE F110 engines and is replacing the F-15C; Portland's Air National Guard
wing became its first operational unit in 2024.
"""

