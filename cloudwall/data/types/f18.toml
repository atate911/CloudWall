[variants.F18S]
name = "Boeing F/A-18E/F Super Hornet and EA-18G Growler"
production = [1999]
more = """
The Super Hornet kept the old name to sell it to Congress as a low-risk upgrade, but it is largely
a new aircraft, bigger, with a quarter more wing area, a third more fuel inside and GE F414 engines
giving 35% more thrust, and the Navy calls it the Rhino to keep the two apart on the radio. Tell it from the Hornet
by its bigger, rectangular intakes. With a refuelling pod under its belly it serves as the carrier
air wing's tanker, and the EA-18G Growler, its two-seat electronic-attack version, carries jamming
gear in the space where the gun was and receiver pods in place of the wingtip missiles.
"""
