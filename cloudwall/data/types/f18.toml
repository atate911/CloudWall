text = """
The Hornet began as the loser of the Air Force's lightweight fighter contest: the Navy doubted that
a single-engined jet on narrow gear like the winning YF-16 would suit carriers, so in 1975 it chose
Northrop's twin-engined YF-17, and McDonnell Douglas rebuilt it with a stronger airframe for
catapults and arrested landings, wider gear, folding wings and more fuel. It was the first
production fighter with digital fly-by-wire. The Navy first planned separate F-18 fighter and A-18
attack versions, but multifunction displays let one aircraft switch roles at the press of a button,
and from 1984 it was officially the F/A-18. On the first day of the Gulf War in 1991, two Hornets
on their way to bomb an Iraqi airfield with four 2,000 lb bombs each were warned of MiG-21s ahead,
shot both down within 40 seconds of their appearing on radar and flew on to drop their bombs.

Long strakes run forward from the wing roots beside the cockpit, and the vortices they shed keep
the Hornet controllable at high angles of attack; with its twin fins canted outward, they give it
its look. The Blue Angels flew Hornets from 1986 until they moved to the Super Hornet at the end of
2020. The US Navy retired its last in 2019, but as of 2026 the Marine Corps and the air forces of
Canada, Finland, Spain, Switzerland and others still fly them.
"""

