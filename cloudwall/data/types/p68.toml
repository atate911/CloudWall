text = """
Luigi Pascale's light twin from Naples, first flown on 25 May 1970: six seats under a high wing,
two 200-hp Lycomings and fixed tricycle landing gear. It was meant for light transport and
training, but police forces and government agencies, from Britain's National Police Air Service to
the Italian State Police and the wildlife and forestry departments of several US states, have made
it an observation aircraft. The Observer, which began as conversions by Sportavia-Putzer in Germany
and was certified in 1980, replaces the nose with a transparent one, giving the crew a view ahead
and below.

Partenavia passed through state ownership into bankruptcy, and in 1998 its type certificate went to
Vulcanair, a Naples maker of P68 spare parts, which builds it still at Capodichino airport, with
turbocharged engines or retractable gear as options. Pascale and his brother Giovanni went on to
found Tecnam in 1986, where his later designs included the P2006T and P2012 Traveller twins.
"""

