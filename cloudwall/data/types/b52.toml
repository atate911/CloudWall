text = """
Its layout was settled over a weekend in October 1948, in a room at the Hotel Van Cleve in Dayton,
Ohio. The Air Force's chief of bomber development had asked Boeing's team for jets in place of
turboprops, and a handful of its engineers redrew the design there as a swept-wing bomber with eight
of them, handing over a bound proposal and a model made with supplies from a hobby shop on the
Monday. 744 were built before the line closed in 1962,
and as of 2026 the US Air Force still flies 76 of the last model, the B-52H, and expects to keep
them into the 2050s.

On Boeing's static-test airframe, the test pilot Tex Johnston watched a wingtip move 32 ft between
the loads of minus 1 g and plus 4 g. The main wheels sit in tandem under the fuselage, bicycle-fashion, with
small outriggers near the wingtips, and the main gear can swivel 20 degrees either way, so in a
strong crosswind the bomber lands crabbed, its nose pointing off the runway while the wheels roll
straight down it. The eight Pratt & Whitney TF33s it has flown with since 1961 hang in pairs in four
pods. As of 2026 the first two are lined up for conversion to eight Rolls-Royce F130s, the
military version of the Gulfstream G650's engine; four bigger engines would have meant a new rudder
and systems. With a new radar, the converted bombers become B-52Js.
"""

