text = """
The 767 opened the oceans to twin-engined jets. In 1985 it became the first airliner approved to fly
up to 120 minutes from the nearest diversion airport, enough to cross the North Atlantic on two
engines, and within a few years more 767s crossed it than any other type. Its cabin seats seven
abreast, two, three and two, so only one seat in seven is a middle seat. Its two-pilot cockpit is
shared with the 757, and many of the later ones carry tall blended winglets fitted after delivery.

The passenger 767 has largely given way to the 787. The freighter, built mostly for FedEx and UPS,
is due to go out of production in 2027, but the US Air Force's KC-46 Pegasus tanker is a 767 too and
keeps the line open. Tell it from an A330 by its narrower fuselage, and from a 757, which has the
same cockpit windows, by its wider body and the second aisle inside.

In 1983 an Air Canada 767, fuelled by a calculation done in pounds instead of kilograms, ran dry at
41,000 ft and glided to a landing at Gimli, Manitoba, on a disused air force runway then used as a
drag strip. All 69 aboard survived, and the "Gimli Glider" flew on until 2008.
"""

