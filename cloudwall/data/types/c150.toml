text = """
Cessna's two-seat trainer, built from 1958 to 1985: more than 31,000 150s and 152s, most of them in
Wichita, with more from Reims Aviation in France. It began as a Cessna 140 with a nosewheel, and it
is laid out like a scaled-down 172, with a strut-braced high wing and fixed tricycle gear, about
three feet shorter in both length and span. Pilot and passenger sit shoulder to shoulder: for 1967
Cessna bowed the doors out an inch and a half on each side to give them more elbow room, and an
optional bench in the baggage space took two children, as long as they weighed no more than 120 lb
between them.

The 152 replaced the 150 in 1977. Its 110 hp Lycoming O-235, in place of the 150's 100 hp
Continental O-200, suited the new low-lead 100LL fuel better; its maximum weight went up 70 lb to
1,670 lb; and its flaps stop at 30 degrees instead of the 150's 40, so that it climbs better with
them fully down. The oldest 150s, built before 1964, have a straight fin and a fastback with no
rear window, and the fin is swept from 1966 on. The Aerobat versions, stressed to +6 and −3 g
against the standard +4.4 and −1.76, came with skylights in the roof, doors that could be jettisoned
and a checkerboard paint scheme.
"""

