The TwinRanger is a LongRanger with two engines, built new by Bell to match Tridair's Gemini ST
conversion, which in 1994 became the first helicopter certified to fly as either a single or a twin
through every phase of flight. Bell delivered only 13, from 1994 to 1997, before the 427 replaced
it.
"""
