text = """
Bell first built it for the US Army's light observation helicopter contest of the early 1960s, and
lost: its YOH-4, nicknamed the Ugly Duckling, was beaten by the Hughes OH-6 in 1965. Bell gave it a
sleeker five-seat cabin with a baggage hold, named it the JetRanger after the piston-engined 47J
Ranger, and from 1967 sold it to civilians, among them the TV news crews and police forces who made
it their own. The Army bought it after all, as the OH-58 Kiowa, and the US Navy and Army taught their
helicopter pilots on it. The LongRanger of 1975 stretched the cabin by 30 inches for two more seats,
and in 1982 a LongRanger, Spirit of Texas, made the first flight around the world by helicopter, in
29 days. It is now in the Smithsonian.

Its Allison 250 turboshaft, now the Rolls-Royce M250, was developed for the same Army requirement,
and grew from 317 hp in the first JetRanger to the 250-C30P of the last LongRangers, built until
2017. The rotor is Bell's classic two-bladed teetering design, the blades joined across the hub so
that they see-saw together on a single hinge atop the mast. That keeps it simple and light, but in
low g the rotor stops controlling the fuselage, which can roll until the blade roots strike the
mast, so pilots are taught never to push over sharply. Two blades also beat slower and louder than
four: the four-bladed rotor Bell later gave the Army's Kiowa Warrior made it quieter than the
two-bladed Kiowa. The 407, which grew from the LongRanger, has that rotor, so count the blades.
"""

[facts]
"First flight" = "January 1966 (206A)"
"Engine" = "Allison (now Rolls-Royce) 250"
"Main rotor" = "2 blades, teetering; 33 ft 4 in (10.2 m) across (206B)"
"Military versions" = "OH-58 Kiowa, TH-57 Sea Ranger, TH-67 Creek"

