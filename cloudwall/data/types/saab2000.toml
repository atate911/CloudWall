text = """
Saab's attempt to give regional airlines a jet's speed at a turboprop's cost: a Saab 340 stretched
by 7.55 m to 50 seats or more, with a wingspan 15% greater and engines of more than twice the power,
designed to cruise at up to Mach 0.62. It was the first airliner with the Allison GMA 2100, now the
Rolls-Royce AE 2100, whose core is shared with the AE 3007 turbofan of Embraer's ERJ and whose other
versions power the C-130J Hercules. To keep the cabin quiet the engines sit further out along the
wing than on the 340, and the six-bladed Dowty propellers, 3.8 m across, turn slowly: 1,100 rpm on
takeoff and 950 in cruise.

Crossair, its main customer, called it the "Concordino" and flew 34. Regional airlines wanted jets,
though, the Bombardier CRJ and Embraer's ERJ 145, and Saab stopped at 63, the last delivered to
Crossair in April 1999. General Motors flew some as a corporate shuttle out of Detroit, one later
carried Penske's NASCAR team, Pakistan's air force flies Saab 2000s with the Erieye early-warning
radar along their backs, and in 2022 Aleutian Airways began flying them to Unalaska, far out in
Alaska's Aleutian Islands.
"""

[facts]
