text = """
A pressurised cabin on the scale of a 310. Cessna conceived the 340 as a cabin-class development of
the 310 and built it largely from parts it already had, the 310's tail and landing gear and the
414's wing, around a new fuselage with six seats, an aisle between them and an airstair door. Work
began in 1969, a prototype crashed in flight testing in 1970, and the first was delivered late, in
1971. The 340A of 1976 has 310-hp turbocharged Continentals, and smaller propellers to meet the
international noise rules. Its cabin holds a 4.2 psi difference from the air outside, enough to
keep it at about 8,000 ft while the aircraft cruises at 20,000, so the passengers fly without
oxygen masks.

In 1979 Cessna offered it without pressurisation, cheaper and identical outside, as the 335. Only
about 65 were sold before it was dropped in 1980, while the 340 stayed in production until 1984.
"""

