text = """
Pan Am asked for an airliner twice the size of the 707, and Boeing, expecting supersonic airliners
to take over passenger flying, designed the 747 to end its days as a freighter. It put the cockpit
up on a short upper deck so the whole nose could swing up for loading, and the hump that made it
famous is the fairing behind that cockpit. It first flew in February 1969, from a factory in Everett
built for it that is still the largest building in the world by volume.

The 747 was the only widebody for years and flew more people further than any airliner before it.
1,574 were built before the line closed in 2023, and today nearly all of those still flying carry
cargo. Its four engines and hump make it unmistakable; the -400 added winglets and a longer upper
deck, and the -8 a still longer body, raked wingtips and saw-tooth engine nacelles.
"""

