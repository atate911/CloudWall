text = """
Pan Am asked for an airliner more than twice the size of the 707, and Boeing, expecting supersonic
airliners to take over passenger flying, designed the 747 to end its days as a freighter. It put the
cockpit up on a short upper deck so the whole nose could swing up for loading, and the hump that
made it famous is the fairing behind that cockpit. It first flew in February 1969, from a factory in
Everett built for it that is still the largest building in the world by volume.

The 747 was the first widebody, alone in airline service until the DC-10 arrived in 1971, and
carried more people than any airliner before it. 1,574 were built before the line closed in 2023,
and today most of those still flying carry cargo. Its four engines and hump make it unmistakable;
the -300 stretched the upper deck, the -400 added winglets, and the -8 a longer body, raked wingtips
and saw-tooth engine nacelles.
"""

