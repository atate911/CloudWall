[variants.BLCF]
name = "Boeing 747 Dreamlifter"
more = """
The Dreamlifter is one of four used 747-400s that Boeing had rebuilt in Taiwan from 2006 to fly 787
parts, wings from Japan and fuselage sections from Italy among them, to final assembly in the United
States, cutting the wings' journey from about 30 days to just over eight hours. The sections were
too big for any freighter flying, so behind the cockpit the fuselage swells into an unpressurised
hold of 65,000 cu ft, three times a 747-400F's, and the whole tail swings open for loading. Boeing's
commercial airplanes chief jokingly apologised to Joe Sutter, the 747's designer: "sorry for what we
did to your plane."
"""
[variants.BLCF.facts]
"First flight" = "September 2006"
"Built" = "4, converted from 747-400s"
"Max payload" = "113,400 kg (250,000 lb)"
"Cargo volume" = "65,000 cu ft (1,840 m³)"
