text = """
A small airliner and freighter built to be cheap to buy and run. Cessna developed the 401 and 402
from the 411 with simpler 300-hp turbocharged Continentals in place of its geared engines, left out
the pressurisation, and made every seat easy to lift out so the cabin could carry cargo. The 402
added a large cargo door, and as the 402B Utiliner it seats ten for commuter airlines, while the
Businessliner has six to eight executive seats. The 402C of 1979 is the most capable: a wing 5 ft
longer without tip tanks, the simpler hydraulic landing gear of the 414 on a track 4 ft wider,
325-hp engines and a takeoff weight of 6,850 lb, and despite the extra weight it stalls a couple of
knots slower and performs better on one engine.

It found its niche on short, thin routes feeding the hubs. Cape Air, its largest operator, flies it
in New England, the Caribbean and Micronesia, alongside the Tecnam P2012 Travellers it bought to
replace it. The 404 Titan of 1975 is a 402 grown larger, with the 421's geared 375-hp engines, ten
passenger seats, a taller fin and a tailplane angled upward. It was the largest piston twin Cessna
had built, and the US Navy flew two as the C-28A and the Swedish Air Force flew it as the Tp 87.
"""

