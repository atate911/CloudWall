]

text = """
Piper's turboprops grew out of its Pressurized Navajo: the same fuselage, given Pratt & Whitney
Canada PT6 turboprops, first flew in August 1969 and became the
PA-31T Cheyenne. The Cheyenne II has 620 shp engines and the Cheyenne I 500 shp ones; the IIXL is
stretched, with 750 shp. All have a long pointed nose, tip tanks, the PA-31's low wing and a conventional
tail, the PT6's exhaust stacks jutting from the side of each nacelle just behind the propeller, and
an airstair door behind the wing. Piper built 823.
"""

[variants.PAY1]
name = "Piper PA-31T1 Cheyenne I"
[variants.PAY1.facts]
"First flight" = "August 1969 (PA-31T)"
"Built" = "823 PA-31Ts"
"Engines" = "2 × Pratt & Whitney Canada PT6A-11, 500 shp"

