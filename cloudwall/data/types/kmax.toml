text = """
A flying crane with one seat and two rotors. The rotors sit side by side on masts splayed 25 degrees
apart and turn in opposite directions, their blades passing between each other like the beaters of
an egg whisk, geared together so they never touch. Their torques cancel, so none of the engine's
power goes to a tail rotor, which in a conventional helicopter can take 10 to 25 percent of it. It
can carry 6,000 lb on its hook, more than the 5,145 lb it weighs empty and almost twice what a Bell
205 lifts with a version of the same Honeywell T53. It was the first helicopter designed and
certified for lifting loads on a line all day: a narrow wedge of a fuselage with bulging side
windows, so the pilot can look straight down at what hangs below.

The layout is Anton Flettner's, who built intermeshing-rotor helicopters for the German navy in the
war and became Kaman's chief designer after it; Kaman's HH-43 Huskie used it first. The K-MAX flew
in December 1991. Its blades are built on Sitka spruce spars, chosen for wood's tolerance of damage
and fatigue, and are twisted by flaps on their trailing edges, worked by rods running up through the
masts, so it needs no hydraulics. Kaman built 38 before stopping in 2003, restarted the line in 2017
for loggers and firefighters, and closed it again in 2023. Two unmanned K-MAXes hauled supplies for
the US Marines in Afghanistan from 2011 to 2014, flying mostly at night.
"""

