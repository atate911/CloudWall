text = """
All four were built by Israel Aerospace Industries at its Tel Aviv plant, and the line began as an
American design: the Aero Commander Jet Commander of 1963. When North American Rockwell bought Aero
Commander, antitrust law would not let it keep the Jet Commander in production alongside its own
Sabreliner, so in 1968 it sold the design to IAI, which developed it into the Westwind and then, in
1984, the Astra. In 2001 Gulfstream bought Galaxy Aerospace, the IAI company holding the Astra and
the larger Galaxy, and renamed them the G100 and G200; the G150 and G280 that followed are still
built in Israel and flown to Dallas for their interiors and paint.

The Galaxy began as a partnership with Russia's Yakovlev design bureau, which designed and built its
forward fuselage and tail until the deal broke down in 1995. It put a new fuselage, wide enough for
three-abreast seating, on a strengthened Astra wing, and first flew on Christmas Day 1997. The G280
keeps that fuselage but has a new Gulfstream-designed wing with the G550's airfoil and a third more
area, a new T-tail and Honeywell HTF7250G engines, and climbs straight to 43,000 ft. Gulfstream had
called it the G250 until 2011, when it noticed that in Mandarin slang 250 means an idiot.
"""

