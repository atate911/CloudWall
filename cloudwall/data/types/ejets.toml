text = """
Embraer designed the E-Jets as two pairs on one fuselage cross-section. The E170 and the slightly
longer E175 share a wing and GE CF34-8E engines of some 14,000 lb thrust. The E190 and E195 are
stretched further, with a wing more than a quarter larger in area, a bigger tailplane, stronger
landing gear and CF34-10Es of some 20,000 lb. Each pair shares 95% of its parts, the whole family
about 89%, and one type rating covers all four, so an airline can move its pilots between sizes as
demand changes. All of them have fly-by-wire controls and the "double-bubble"
fuselage, four abreast with no middle seat.

The E190 and E195 seat about as many as the first DC-9s and 737s, and Embraer aimed them at the gap
between regional and mainline jets. JetBlue launched the E190 in 2003 with an order for 100, and in
2017 an Airlink E190 opened the first scheduled air service in Saint Helena's history, six hours
from Johannesburg by way of Windhoek. Tell an E190 or E195 from the shorter pair by its length and
the emergency exit over each wing, which the E170 and E175 lack, and from the second-generation E2
by its winglets, where the E2's longer wing ends in a raked tip.
"""

[facts]
"First flight" = "February 2002 (E170)"
"Engines" = "2 × GE CF34-8E or CF34-10E"

[variants.E170]
name = "Embraer 170"
production = [2004, 2018]
more = """
The E170 was the first E-Jet: LOT Polish Airlines flew the type's first revenue flight, Warsaw to
Vienna, in March 2004, and retired its last E170 on the same route in October 2026. Only 191 were built, against more than
1,000 E175s ordered, and with demand for 70-seat jets fading, Embraer gave it no E2 successor.
"""
[variants.E170.facts]
"First flight" = "February 2002"
"Built" = "191"
"Engines" = "2 × GE CF34-8E"

