text = """
Designed in Kyiv for the Soviet air force and built there and at Ulyanovsk in Russia, the An-124
follows the C-5 Galaxy's layout, with a nose that hinges up, a ramp under the tail and a deck for
the crew and 88 passengers above the hold, but it carries about a sixth more, up to 150 tonnes. The
hold floor is titanium, an overhead crane runs inside, and the 24-wheel landing gear is sprung for
rough fields and kneels to bring the floor down to loading height. Only the upper deck is fully
pressurised, and the hold is kept at about a quarter of sea-level pressure, so it rarely carries
troops or passengers. Tell it from a C-5 by the tail: the An-124's tailplane sits low, on the
fuselage, where the C-5's is perched on top of the fin.

Since the Soviet Union fell it has earned its keep flying the charter loads nothing else can take:
Atlas V rockets to Cape Canaveral, satellites, a diesel locomotive from Canada to Ireland, and in
2005 the Obelisk of Axum, home to Ethiopia from Rome. In 2019 some 26 flew commercially, most of
them with Antonov Airlines of Ukraine or Volga-Dnepr of Russia, until the war divided the fleet. On
24 February 2022 Russian artillery destroyed one of Antonov's at its base at Hostomel, outside Kyiv,
while five more, away on charters, were diverted to Leipzig; a Russian An-124 stranded in Toronto
when Canada closed its airspace to Russian aircraft was seized there in 2023.
"""

