production = [1969]
more = """
The pressurised 58P and the turbocharged 58TC, built from 1976 to the mid-1980s, share its
designator. Since 2005 it has been built as the G58, with a Garmin G1000 glass cockpit.
"""
[variants.BE58.facts]
