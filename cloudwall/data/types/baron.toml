text = """
Beech made the Baron from its Travel Air, itself a Bonanza with two engines, giving it six-cylinder
Continentals in streamlined nacelles and the swept fin of the Debonair to take on the Piper Aztec
and the latest Cessna 310. The prototype first flew on 29 February 1960 and Barons were built for
more than six decades from 1961, over 7,000 of them. In November 2025 Textron Aviation, Beechcraft's
owner, said it would build no more once its last orders were filled; in 2024 it had delivered just
two.

The short-bodied 55 seats up to six, but reaching the third row means climbing past the second, and
with all six seats full it easily goes beyond its aft centre-of-gravity limit, so many owners use
the back as a baggage hold. The Baron 58 of 1969 fixed both: Beech stretched the cabin 10 inches,
moved the fuselage forward on the wing and added double doors at the back, behind club seats in the
middle row. It is the one charter and cargo operators prefer, and the easiest to pick out, with four
windows down each side where the 55 has three.
"""

[facts]
"First flight" = "February 1960"
"Built" = "7,011 by the end of 2025"

