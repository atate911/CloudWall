[variants.MD90]
name = "McDonnell Douglas MD-90"
production = [1995, 2000]
more = """
The MD-90 is the last and longest stretch, 1.4 m longer than an MD-88, with the A320's IAE V2500
engines in place of the JT8Ds; their fat nacelles are the quickest way to tell it from an MD-80.
McDonnell Douglas first meant to give it unducted propfans, which an MD-81 flew as a testbed, and
turned to the V2500 when airlines showed no interest; Delta's launch order followed within six
weeks. 116 were built, and Delta flew the last passenger service in June 2020.
"""
