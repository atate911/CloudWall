text = """
The MD-80 is the DC-9 stretched as far as it would go: a fuselage 4.3 m longer than the DC-9-50's,
a wing 28% larger with new sections at the root and the tip, and refanned, quieter Pratt & Whitney
JT8D-200s on the tail. It flew in 1979 as the DC-9 Super 80 and became the MD-80 in 1983, though the
type certificate still calls most of them DC-9s, the DC-9-81 to -87. The long, slender body ahead of
a T-tail and two tail engines makes it easy to pick out, and its crews know it as the Mad Dog.
Inside, the seats are five abreast, two and three, so each row has only one middle seat.

American Airlines built its 1980s and 1990s fleet around it, with more than 360 at its peak in 2002,
nearly a third of the 1,191 made. Its old engines burned nearly a quarter more fuel an hour than the
larger 737-800, and American retired its last in 2019; Delta's final flights, in June 2020, were the
last scheduled passenger service of any McDonnell Douglas airliner in the US. Some survivors were converted to haul freight, and Erickson
Aero Tanker turned MD-87s into firefighting tankers that carry 4,000 US gallons of retardant.
"""

