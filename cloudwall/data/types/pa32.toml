text = """
Piper's Cherokee stretched to six or seven seats, first flown in December 1963 and certified in
1965. It has a six-cylinder Lycoming of 260 or 300 hp, a baggage compartment in the nose between
the engine and the cockpit, and a wide double door at the back of the cabin that makes it easy to
load with people or freight, and it has worked around the world as an air taxi, in the bush and on
medical flights. Next to the four-seat Cherokee it is longer and has that second door. The PA-34
Seneca twin began as a Cherokee Six with an extra engine on each wing, flown as a trimotor to prove
the idea.

When a flood destroyed Piper's Comanche production line in 1972, the company made the Cherokee Six
its high-performance single instead, adding retractable gear for the Lance of 1975. Midway through
1978 the Lance moved its tailplane to the top of the fin, and pilots complained that the T-tail had
too little authority at low speed; from 1980 the Saratoga went back to a conventional tail and
replaced the Cherokee's constant-chord "Hershey bar" wing with a tapered one. The last fixed-gear
PA-32s were built in 2007 and the last Saratogas in 2009.
"""

