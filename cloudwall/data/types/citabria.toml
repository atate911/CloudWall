name = "Champion Citabria"
types = ["CH7A", "CH7B", "BL8"]
checked = "2026-11"
sources = [
  "https://cfapps.icao.int/doc8643/reports/Part3-By%20Model%20Number_Name.pdf",
  "https://en.wikipedia.org/wiki/American_Champion_Citabria",
  "https://en.wikipedia.org/wiki/Aeronca_Champion",
