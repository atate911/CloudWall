text = """
Aérospatiale grew the Super Puma from its SA 330 Puma in the 1970s, keeping the layout but adding
Turbomeca Makila engines, composite rotor blades, a tougher airframe on crashworthy landing gear, a
more streamlined nose and a fin under the tail boom, the quickest way to tell it from a Puma. It
first flew in September 1978 and was delivered from 1981, burning 17% less fuel than the Puma and
flying faster and further. Aérospatiale had tried a Fenestron on a Puma and found that a helicopter
this big was past what the ducted fan could practically do, so the Super Puma kept an open tail
rotor. Military ones have been sold as the Cougar since 1990, and the stretched civil versions,
seating up to about 20, became a workhorse of the North Sea oil fields.

Much of their offshore story is about the main gearbox. In April 2009 an AS332 L2 crashed off
Aberdeen after a catastrophic failure in the gearbox's epicyclic module, killing all 16 aboard. Two
of its successor, the EC225, ditched in the North Sea in 2012 after a gearbox shaft cracked, and in
April 2016 another lost its main rotor near Bergen, killing all 13, after a fatigue crack in a gear
inside the gearbox had grown unseen. Regulators grounded most of the world's EC225s, and Norway's
Statoil, whose contract it had been flying, turned to the Sikorsky S-92.
"""

