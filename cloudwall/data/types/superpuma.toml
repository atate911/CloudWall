text = """
Aérospatiale grew the Super Puma from its SA 330 Puma in the 1970s, keeping the layout but adding
Turbomeca Makila engines, composite rotor blades, a tougher airframe on crashworthy landing gear, a
more streamlined nose and a fin under the tail boom, the quickest way to tell it from a Puma. It
first flew in September 1978 and was delivered from 1981, burning 17% less fuel than the Puma and
flying faster and further. Aérospatiale tried a large Fenestron on a Puma at the time and concluded
that a ducted fan had practical limits on a helicopter this size, and the Super Puma keeps an open,
five-bladed tail rotor. Military ones have been sold as the Cougar since 1990, and the stretched
civil versions, seating up to about 20, became a workhorse of the North Sea oil fields.

In April 2009 an AS332 L2 crashed into the sea off Peterhead, Scotland, killing all 16 aboard, when
a second-stage planet gear in the epicyclic module of its main gearbox broke from fatigue; a metal
particle found 36 flying hours earlier had not been recognised as the warning it was. In April 2016
its successor, an EC225, lost its main rotor near Bergen, killing all 13, after the same kind of
gear failed the same way, from a crack that grew beneath the surface without being detected. By July
80% of the world's EC225s were on the ground, and Statoil, whose contract it had been flying, gave
up Super Pumas altogether.
"""

