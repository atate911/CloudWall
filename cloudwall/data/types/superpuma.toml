more = """
The EC225, now the H225, first flew in November 2000 with five rotor blades where the AS332 has
four, Makila 2A1 engines and a redesigned main gearbox with an emergency oil-spray system that kept
it running for 50 minutes in tests, beyond the 30 the rules ask for. The military version, the
H225M, formerly the EC725 Caracal, flies combat search and rescue for the French Air Force and is
built in Brazil by Helibras for that country's forces.
"""
