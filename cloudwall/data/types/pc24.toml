text = """
Pilatus built its first jet for the owners of its PC-12 turboprop, who wanted more speed and range
without giving up the short, rough strips the PC-12 could use. The PC-24 is certified to operate
from gravel, dirt, grass, wet earth and snow. Its long-stroke trailing-link gear has two wheels on
each main leg, on tyres at only 70 psi so they don't sink in, the engines sit high on the rear
fuselage, and the flaps that shield them from flying debris have a replaceable, abradable surface.
At the back on the left is a cargo door big enough for a pallet, the first, Pilatus says, fitted as
standard to a business jet.

It was unveiled in Geneva in 2013, rolled out on Switzerland's national day in 2014 and first flew
in May 2015 from Buochs, near the Pilatus works at Stans. When orders opened in 2014, a year before
it flew, the first production run of 84 sold out in 36 hours. Australia's Royal Flying Doctor
Service took the first of five in 2018, fitted out as air ambulances with three beds, to fly
alongside its PC-12s, and the same jet is cleared for the steep approach into London City.
"""

