name = "Bombardier CRJ"
types = ["CRJ1", "CRJ2", "CRJ7", "CRJ9", "CRJX"]
production = [1992, 2020]
checked = "2026-11"
sources = [
  "https://en.wikipedia.org/wiki/Bombardier_CRJ100/200",
  "https://en.wikipedia.org/wiki/Bombardier_CRJ700_series",
]

text = """
Bombardier made the first CRJ by stretching its Challenger business jet into a 50-seat airliner, and
grew it in turn into the 70-seat CRJ700, the 76-to-90-seat CRJ900 and the 104-seat CRJ1000. The family
keeps the business jet's slim fuselage, four abreast in a cabin not much over six feet tall, and its
two GE CF34 engines mounted on the tail below a T-tail. That keeps the wing clean and the cabin
ahead of the engines quiet, but leaves overhead bins too small for most roller bags, which is why
carry-ons are so often left at the aircraft's door to be loaded below.

It started the regional-jet era in the 1990s, when airlines found they could fly a jet on routes
that had only ever seen turboprops, and nearly 2,000 were built. Mitsubishi bought the programme in
2020 to support the fleet, and closed the line. Tell it from an E175 by its engines, on the tail
rather than under the wing, and by its long, narrow, pencil-like fuselage.
"""

