text = """
Bombardier made the first CRJ by stretching its Challenger business jet into a 50-seat airliner, and
grew it in turn into the CRJ700 of up to 78 seats, the CRJ900 of up to 90 and the CRJ1000 of up to
104. The family keeps the business jet's slim fuselage, four abreast in a cabin not much over six
feet tall, and its two GE CF34 engines mounted on the tail below a T-tail. That keeps the wing clean
and the cabin ahead of the engines quiet, but leaves overhead bins too small for most roller bags,
which is why carry-ons are so often left at the aircraft's door to be loaded below.

It led the regional-jet boom of the 1990s, when airlines found a jet could take over routes flown by
turboprops, and 1,945 were built. Mitsubishi bought the programme in 2020 to support the fleet, and
the last one was delivered in February 2021. Tell it from an E175 by its engines, on the tail rather
than under the wing, and by its long, narrow, pencil-like fuselage.
"""

