[variants.GL7T]
name = "Bombardier Global 7500 or 8000"
production = [2018]
more = """
The Global 7500 of 2018 is 11 ft longer and shares little with the first Global beyond its
cross-section: a new, thinner wing swept at 35.3° with slats and double-slotted flaps, fly-by-wire
controls derived from the CSeries airliner's, aluminium-lithium structure and GE Passport engines
whose 52-inch fan is a single titanium blisk, blades and disc in one piece. It was the first
purpose-built business jet with four cabin zones, and in 2019 one flew 8,152 nm from Singapore to
Tucson, a record for such a jet until a Gulfstream G650ER beat it a month later. The Global 8000
replaced it in 2025, with 8,000 nm of range and a top speed of Mach 0.95, the fastest of any civil
aircraft since Concorde; a test aircraft reached Mach 1.015 in 2021.
"""
