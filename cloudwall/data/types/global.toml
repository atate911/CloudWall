text = """
Bombardier unveiled the Global Express in 1991 to beat Gulfstream on range, and by its launch had
promised 6,500 nm. Rather than start from nothing it kept the fuselage cross-section of
its own Challenger and CRJ, dropping the floor two inches for more shoulder room, and gave it a new
T-tail and a new wing swept at 35°, with two BMW Rolls-Royce BR710s on the tail. The wing is
flexible and, on the Global 6000, more heavily loaded than any rival's, and both soften the ride
through turbulence. The Global 5000 is a shortened version; the XRS, 6000 and
6500 are the full-length jet updated, the 5500 and 6500 with a reworked wing and Rolls-Royce Pearl
engines.

Range and a 51,000 ft ceiling have made it a favourite of air forces needing a high, long-endurance
platform. The RAF flew it with a ground-surveillance radar as the Sentinel, the US Air Force flies
it as the E-11A airborne communications relay, Saab builds its GlobalEye early-warning aircraft on
the Global 6000, and the US Army's ME-11B intelligence aircraft is a Global 6500.
"""

