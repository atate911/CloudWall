text = """
ATRs are built for short hops, where a turboprop's economy counts for more than a jet's speed.
Aérospatiale and Aeritalia set out in 1981 to burn about half the fuel of the Fokker F27 and HS 748
on a 200 nm sector, and gave the result a long, straight high wing. The ATR 72's wing spans twelve
times its average chord, and about 30% of it by weight is carbon fibre, which makes it a fifth
lighter. There is no auxiliary power unit. At the gate the right-hand engine can run with a brake
holding its propeller still, supplying electricity and air. The main wheels retract into fairings on
the fuselage sides, and passengers usually board through a door at the back, with the front one kept
for cargo.

The ATR 42, named for its original 42 seats, entered service in 1985, and the 72, 4.5 m longer and
with more powerful engines, in 1989. Both come off one line in Toulouse and share most of their
parts, and that has kept the smaller one in production: by 2015 it was the only 50-seat regional
airliner still built. Later models have six-bladed propellers where the first ATRs have four. In
1994 an American Eagle ATR 72 crashed near Roselawn, Indiana, after freezing precipitation built a
ridge of ice behind its de-icing boots and its ailerons snapped over; the boots on both types were
then extended back to 12.5% of the wing's chord, from 5% on the 42 and 7% on the 72.
"""

