The -400 put six-bladed propellers on the -320's PW121 engines and small winglets on its wingtips.
It sold in tiny numbers: three Surveyor patrol aircraft for the Italian government, and the only two
civil ones to CSA Czech Airlines in 1995 and 1996.
"""
