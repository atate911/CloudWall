text = """
Frank Robinson set out to build a helicopter cheap enough for people to learn on and own, and the
two-seat R22, from 1979, and four-seat R44, from 1993, each became the world's best-selling civil
helicopter. They have a two-bladed teetering rotor, a light airframe and a T-shaped cyclic that
swings between the two front seats, so either pilot can fly. The rotor's design makes low-g
manoeuvres dangerous, risking mast bumping, and anyone flying an R22 or R44 in the US must first
complete special ground training.

The R66 adds a Rolls-Royce turbine and a fifth seat. From the ground they are small and light, with a
bubble cabin, a thin tail boom and the slap of a two-bladed rotor.
"""

