text = """
Frank Robinson set out to build a helicopter cheap enough for people to learn on and own, and the
two-seat R22, from 1979, and four-seat R44 became the most common civil helicopters in the world.
They have a two-bladed teetering rotor, a light airframe and a T-shaped cyclic that swings between
the two front seats, so either pilot can fly. The rotor's design makes low-g manoeuvres dangerous,
and every Robinson pilot in the US must have special training before flying one.

The R66 adds a Rolls-Royce turbine and a fifth seat. From the ground they are small and light, with a
bubble cabin, a thin tail boom and the slap of a two-bladed rotor.
"""

