text = """
The DC-4 was an airliner the war took over before any airline could fly it. Douglas designed it with
five US airlines, but after Pearl Harbor the Army Air Forces took over their orders, and nearly all
were built as C-54 Skymaster transports, which flew a million miles a month across the North
Atlantic. It had the tricycle landing gear the DC-3 lacked, so it sits level on the ground, but its
cabin was never pressurised. A specially fitted C-54, nicknamed the Sacred Cow, became the first
presidential aircraft, ordered for Franklin Roosevelt.

In the Berlin Airlift of 1948–49, 330 DC-4s and C-54s flew food and coal into the blockaded city, one
of them piloted by Gail Halvorsen, who dropped sweets to the children below on parachutes made from
handkerchiefs. After the war hundreds of surplus C-54s became airliners and freighters alongside the
79 DC-4s Douglas built new, and Freddie Laker gave 21 a raised cockpit and a nose that swung open so
cars could be driven aboard, as the Carvair. A few survive, among them a C-54 that tours as a flying
museum of the airlift.
"""

