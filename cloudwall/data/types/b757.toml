text = """
The 757 was built for power. Its two engines, Rolls-Royce RB211s or Pratt & Whitney PW2000s, give it
more thrust for its weight than the jets it competed with, so it climbs out steeply and can use
short, hot or high runways that would limit other jets of its size. Airlines prized it for routes
too long for a 737 and too thin for a widebody: across the Atlantic from mid-sized cities, or to
Hawaii from the West Coast. Production ended in 2004 after 1,050 were built. Nothing matched it until Airbus's long-range A321s,
so airlines have kept flying it for decades.

Its wake is part of its story. In the early 1990s, smaller aircraft following close behind 757s were
upset by the vortices off its wings, and some crashed, so controllers began spacing aircraft further
behind it than behind others of its weight; under today's FAA wake categories it still has one to
itself. From the ground it is easy to know by its long, slender fuselage on tall landing gear. It
shares a cockpit and a pilot rating with the larger 767, and the US Air Force flies it as the C-32,
often as Air Force Two.
"""

[facts]
