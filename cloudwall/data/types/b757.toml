checked = "2026-11"
sources = [
  "https://en.wikipedia.org/wiki/Boeing_757",
  "https://www.boeing.com/content/dam/boeing/v2/airports/acaps/757_Rev_H.pdf",
  "https://www.faa.gov/documentLibrary/media/Order/JO_7110.126A_Consolidated_Wake_Turbulence_Separation_Standard_FINAL_SIGNED_508.pdf",
  "https://www.faa.gov/documentLibrary/media/Order/7110.65BB_Chg_2_dtd_1-22-26.pdf",
  "https://beatofhawaii.com/hawaii-travel-was-forever-changed-by-boeing-757",
