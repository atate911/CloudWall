text = """
Airbus designed the A330 and the four-engined A340 together, on one wing, one fuselage and one
cockpit, and aimed the twin at busy medium-range routes; it became an ocean-crosser as its record in
service won it approval, step by step, to fly further from a diversion airport. Its flight deck is
laid out like the A320's, so pilots move between the two on a short course. Seats usually run eight
abreast in economy, two, four and two, so a couple by the window never has a stranger beside them.

The A330neo, from 2018, has Rolls-Royce Trent 7000 engines, its only option, and curved sharklets in
place of the older ones' angled winglets, which widen its span by 3.7 m to 64 m. The A330 MRTT
tanker flies for many air forces. Tell an A330 from a 777 by its main gear, four wheels on each leg
instead of six, and from a 767 by its wider body and bigger wing, which on every A330 ends in a
winglet.

In 2001 an Air Transat A330 lost all its fuel through a leak in one engine's fuel line over the
Atlantic, and glided with both engines stopped for about 19 minutes and 120 km to a landing in the
Azores. All 306 aboard survived.
"""

