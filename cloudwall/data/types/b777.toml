name = "Boeing 777"
types = ["B772", "B77L", "B773", "B77W", "B778", "B779"]
production = [1995]
checked = "2026-11"
sources = [
  "https://en.wikipedia.org/wiki/Boeing_777",
  "https://www.boeing.com/commercial/777",
  "https://www.boeing.com/content/dam/boeing/v2/airports/acaps/777-200-200ER-300_Rev_E.pdf",
  "https://www.boeing.com/content/dam/boeing/v2/airports/acaps/777-200LR-300ER-F_Rev_G.pdf",
  "https://en.wikipedia.org/wiki/General_Electric_GE90",
  "https://en.wikipedia.org/wiki/General_Electric_GE9X",
  "https://en.wikipedia.org/wiki/Airbus_A350",
  "https://en.wikipedia.org/wiki/Boeing_777X",
  "https://www.boeing.com/commercial/777x",
  "https://www.boeing.com/commercial/777x/by-design",
]

text = """
The 777 was Boeing's first fly-by-wire airliner and the first designed entirely on computer, with
eight airlines in the room as it was drawn. It was also the first airliner cleared at entry into
service to fly 180 minutes from the nearest diversion airport, which put a twinjet on almost any
ocean route. Its engines are among the largest ever built: the GE90-115B of the 777-300ER is the
most powerful jet engine in service, its fan 3.25 m across.

Look for its main landing gear, six wheels on each leg in three pairs, which among other twinjets
only the Airbus A350-1000 has, and for the tail cone, which ends in a flat, upright blade instead of
a point. The engines are so large that from below they seem to fill the space under the wing, and
the wingtips have no winglet; on the later long-range models they are raked back.
"""

[facts]
"First flight" = "June 1994"
"Engines" = "2 × GE90, Pratt & Whitney PW4000 or Rolls-Royce Trent 800"

[variants.B772]
name = "Boeing 777-200"
[variants.B772.facts]
"Max takeoff weight" = "up to 297,600 kg (656,000 lb)"

[variants.B77L]
name = "Boeing 777-200LR or 777F"
more = """
The long-range -200LR flew 21,602 km nonstop from Hong Kong to London, the long way round over the
Pacific and the Atlantic, in 2005, a record for an airliner at the time. The 777F freighter shares
its wing and engines.
"""
[variants.B77L.facts]
"Engines" = "2 × GE90-110B or GE90-115B"
"Range" = "up to 8,500 nm (15,740 km), -200LR"
"Max takeoff weight" = "up to 347,800 kg (767,000 lb)"

[variants.B773]
name = "Boeing 777-300"
[variants.B773.facts]
"Max takeoff weight" = "up to 299,400 kg (660,000 lb)"

[variants.B77W]
name = "Boeing 777-300ER"
more = """
The -300ER, at 73.9 m one of the longest airliners flying, is the most common 777, and its two
GE90-115Bs, each rated at 115,300 lb of thrust, are the only engines it was offered with.
"""
[variants.B77W.facts]
"Engines" = "2 × GE90-115B"
"Range" = "up to 7,500 nm (13,890 km)"
"Max takeoff weight" = "up to 351,500 kg (775,000 lb)"

[variants.B778]
name = "Boeing 777-8"
text = """
The 777-8 is the shorter, longer-ranged member of the 777X family: 70.9 m long, 5.8 m shorter than
the 777-9, with a higher maximum takeoff weight and a range of up to 9,500 nm. It shares the -9's
new carbon-fibre wing, the first composite wing Boeing has built itself, whose outer 3.5 m folds up
on the ground, from a control in the cockpit, so that its 71.8 m span fits the gates today's 777s
use. It shares the GE9X engines too, with a fan case 3.4 m across, larger than the GE90's.

Boeing put the passenger -8 behind the -9 in 2019, and the freighter version, launched in 2022 by
Qatar Airways to replace its 777Fs and able to carry 118 tonnes, has come first. As of 2026 no 777-8
has flown, and the first freighters are due in 2028. The designator covers both.
"""
[variants.B778.facts]
"First flight" = "not yet, as of 2026"
"Engines" = "2 × GE9X"
"Range" = "up to 9,500 nm (17,590 km)"
"Max takeoff weight" = "365,140 kg (805,000 lb)"
"Max payload" = "118,000 kg (260,000 lb), freighter"

[variants.B779]
name = "Boeing 777-9"
text = """
The 777-9 keeps the 777's fuselage and name but little else that shows. Its wing is new, carbon
fibre and the first composite wing Boeing has built itself, with a span of 71.8 m, too wide for the
gates today's 777s use, so the outer 3.5 m of each wing folds up on the ground, from a control in the
cockpit, to bring it down to 64.8 m. Its GE9X engines have a fan case 3.4 m across with 16 composite
blades, where the GE90 has 22, and one made a record 134,300 lb of thrust on a test stand in 2017.
Thinner cabin walls add 10 cm of width for ten-abreast seating, and from the 787 it takes larger
windows and a cabin pressurised to 6,000 ft. At 76.7 m it will be the longest airliner flying.

It first flew in January 2020, but engine problems, a fuselage that burst open in a 2019 ground load
test, a tougher FAA after the 737 MAX crashes and cracked engine-mount links found in 2024 have held
it back. As of 2026 it is still in certification testing and has not entered service; Boeing expects
to deliver the first, to Lufthansa, in 2027, seven years later than first planned. On the ground the
folded wingtips, standing up at the end of each wing, give it away.
"""
[variants.B779.facts]
"First flight" = "January 2020"
"Engines" = "2 × GE9X"
"Range" = "up to 8,000 nm (14,820 km)"
"Max takeoff weight" = "351,530 kg (775,000 lb)"
