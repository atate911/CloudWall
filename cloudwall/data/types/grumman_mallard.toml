text = """
Grumman's postwar airliner for harbour-to-harbour hops along the East Coast, with two pilots and ten
passengers. It kept the Goose's high wing, radial engines and big straight tail, but brought a
stressed-skin structure, a two-step hull, tricycle landing gear and fuel in tanks at the wingtips.
It first flew on 30 April 1946, but cheap war-surplus aircraft and the spread of small airports
left few airlines wanting it, and most of the 59 built went to companies and the rich: Fruehauf Trailer
flew customers from Detroit to its fishing lodge on Georgian Bay, the Aga Khan bought one, and one
was reportedly King Farouk's favourite aircraft.

In the 1970s Frakes Aviation re-engined some with Pratt & Whitney Canada PT6A turboprops and room
for 17 passengers as Turbo Mallards, and Chalk's flew them between Florida and the Bahamas. On 19
December 2005 the right wing of one, built in 1947, came off just after it took off from Miami for
Bimini, and all 20 aboard were killed; the NTSB found fatigue cracks that the airline's maintenance
had failed to find and repair. In northern Australia, Paspaley Pearling has rebuilt its Mallards
with turboprops to support its pearling.
"""

