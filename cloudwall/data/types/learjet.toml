text = """
The Learjet 45 was the first all-new Learjet since the original Model 23: every model in between had
grown out of that 1963 design. It first flew on 7 October 1995, 32 years to the day after the 23,
and Bombardier, which had bought Learjet in 1990, gave it a lighter structure than the old jets'
many-spar wings, a flat-floored cabin with a non-circular section for headroom, wings from de
Havilland Canada and a fuselage and tail from Shorts in Belfast. It kept the family look, with a
sharp nose, a wrap-around windscreen, a T-tail and winglets, and two small "delta fins" under the
tail that steady it and help it recover from a deep stall. Early owners had a love-hate relationship
with it, and a faulty tailplane fastener grounded the fleet for a month in 2003, but by 2017 Business
& Commercial Aviation was calling it a rock-solid, reliable workhorse.

The 40 is a 45 shortened by two feet, and the XR versions of both have engines that hold their
full thrust on hotter days. The
70 and 75 of 2013 brought engines with 10% more takeoff thrust, Garmin G5000 touch-screen avionics
and canted winglets borrowed from the Global 7500's design. They were the last Learjets. Bombardier
ended production in 2021 to concentrate on its Challengers and Globals, and the final 75 was
delivered on 28 March 2022, almost 60 years after the first Learjet flew and more than 3,000
Learjets later.
"""

