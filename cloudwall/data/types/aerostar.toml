text = """
Ted Smith had worked on the A-26 Invader at Douglas and conceived the Aero Commander before he
designed the Aerostar, and while it was in production it was the fastest piston twin there was,
cruising at about 220 knots in the first 600s and 261 in the last 700Ps. It gets there with a
heavily loaded wing set halfway up a slim fuselage, close attention to drag and, on early models,
engines cooled without cowl flaps, which Smith insisted it didn't need. Its wing skins are
unusually thick and stiff and its controls work through push-pull rods and torque tubes instead of
cables, and with the high wing loading they give it a notably smooth ride in turbulence.

The same wing makes it demanding at the slow end. It needs long runways, and pilots are taught to
keep the speed up on the approach and hold off full flap until the runway is assured. Everyone
boards through a single clamshell door beside the pilot, the passengers climbing over the folded
pilot's seat. Piper bought the design in 1978 and built it as the PA-60 until 1984, adding the
602P and the 700P, whose 350 hp engines turn in opposite directions. Aerostar Aircraft, which owns
the type certificate and supports the fleet, has flown one rebuilt with two small Pratt & Whitney
Canada jet engines in place of its pistons.
"""

