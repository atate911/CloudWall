text = """
Every Cirrus carries a parachute for the whole aircraft. Pull a red handle in the cabin ceiling and a
rocket bursts through a cover behind the cabin, pulling the canopy out, and the aircraft comes down
under it. As of 2026 the system has been credited with saving more than 300 lives. That, a composite
airframe assembled in Duluth, Minnesota, and a glass cockpit have made the SR22 the best-selling
piston aircraft in the world every year since 2003.

The SR22 has a 310 hp Continental and cruises at up to 183 knots; the turbocharged SR22T goes higher
and faster still. Pilots fly it with a side yoke instead of a control wheel. It is a sleek low-wing
single with fixed gear in fairings and a three-bladed propeller, and the parachute's cover sits on
top of the fuselage behind the cabin, with a rocket warning placard on either side.
