text = """
MBB and Kawasaki designed the BK 117 together from 1977: MBB brought the hingeless rotor of its Bo
105, the flight controls and the tail boom, Kawasaki the airframe, main transmission and landing
gear, and each built it for its own market. It first flew in June 1979 and was delivered from 1983.
The tail boom sits high on the cabin so that clamshell doors at the back can open beneath it, and a
stretcher can go in with the rotor turning, which with its second engine made it, and everything
built from it since, a mainstay of air ambulances, rescue services and police.

Eurocopter joined the EC135's cockpit to the rear of a BK 117 to make the EC145, delivered from
2002, which the US Army bought as the UH-72 Lakota. The EC145 T2 of 2014, renamed H145, has Safran
Arriel 2E engines and a Fenestron in place of the open tail rotor, and since 2020 a five-bladed
bearingless rotor, which added 150 kg of payload and tells the newest from the four-bladed H135. On
paper every one, the H145 included, is still a BK 117, all on one type certificate. In September
2019 an H145 landed on the summit of Aconcagua, 6,962 m, a record for a twin-engined helicopter.
"""

