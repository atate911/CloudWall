name = "Ultralight or microlight"
types = ["ULAC", "PARA"]
checked = "2026-11"
sources = [
  "https://www.icao.int/operational-safety/doc-8643-aircraft-type-designators/special-designators",
  "https://www.faa.gov/documentLibrary/media/Order/FAA_Order_JO_7360.1K_Aircraft_Type_Designators.pdf",
  "https://skybrary.aero/articles/ultralightmicrolight-aircraft",
  "https://en.wikipedia.org/wiki/Ultralight_aircraft_(United_States)",
  "https://en.wikipedia.org/wiki/Ultralight_aviation",
  "https://en.wikipedia.org/wiki/Microlight",
  "https://en.wikipedia.org/wiki/Quicksilver_MX",
  "https://en.wikipedia.org/wiki/Ultralight_trike",
  "https://en.wikipedia.org/wiki/Hang_gliding",
  "https://en.wikipedia.org/wiki/Powered_parachute",
]

text = """
In the US an ultralight isn't legally an aircraft but a vehicle, flown under Part 103 of the federal
aviation rules with no pilot's licence, registration or airworthiness certificate, as long as it has
one seat, weighs less than 254 lb empty, carries no more than 5 US gallons of fuel, can't exceed 55
knots in level flight and stalls at 24 or less. It may fly only by day, never over towns, and needs
permission to enter the controlled airspace around airports. The rules followed a wave of cheap
powered flying that grew out of hang gliding in the late 1970s, and were written around the most
popular design of the day, the Quicksilver, a frame of bolted aluminium tube and Dacron that began
as a weight-shift glider and gained a rudder, an elevator and then true ailerons.

Elsewhere they are microlights, usually with two seats and a licence to fly them, and traditionally
limited to 450 kg at takeoff, or 472.5 kg with a ballistic parachute. ICAO in principle gives every
type heavier than that a designator of its own, and files the rest, up to 454 kg and stalling at no
more than 35 knots, under ULAC. Most are one of two kinds. A weight-shift trike hangs a three-wheeled
pod, with the seats and a pusher engine, beneath a flexible hang-glider wing, and the pilot flies it by
shifting weight against a bar, pushing it out to slow down and pulling it in to go faster, the
reverse of a stick. A three-axis microlight has ailerons, elevator and rudder, and flies like any
light aeroplane.
"""

[facts]
"Covers" = "up to 454 kg (1,000 lb), stalling at 35 kt or less"
"US ultralight (Part 103)" = "1 seat, under 254 lb empty, 5 US gal of fuel, 55 kt top speed"
"Microlight (FAI)" = "450 kg, 472.5 kg with a ballistic parachute"

[variants.PARA]
name = "Powered parachute"
more = """
PARA is ICAO's code for powered parachutes: a wheeled cart with seats and an engine behind them, slung
beneath a ram-air parafoil like a skydiver's canopy. The pilot steers with foot bars that pull down
the trailing edge on one side, and since the wing flies at one speed, about 25 to 35 mph, the throttle
only makes it climb or descend. The smallest single-seaters fly as US ultralights, and two-seaters as
light-sport aircraft.
"""
[variants.PARA.facts]
"Airspeed" = "25–35 mph (22–30 kt), fixed by the wing"
"First flight" = "1981"
