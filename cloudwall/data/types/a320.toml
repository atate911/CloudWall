text = """
The A320 was the first airliner with all-digital fly-by-wire controls and a sidestick. When it
entered service in 1988 the control column was gone, and in normal law its computers kept the
aircraft inside its limits whatever the pilot asked of the stick. Every airliner Airbus has designed
since has been flown the same way, so a pilot qualified on one moves to another with a short course.
The family runs from the 31 m A318 to the 44.5 m A321 on one cockpit and much the same wing, and its
cabin is about 16 cm wider than a 737's, which is why its seats are usually a little roomier.

Next to a 737 it has a rounder, blunter nose and longer landing gear, so it stands higher off the
ground. Older ones whistle on approach: the opening for a fuel-tank over-pressure valve under each
wing sings like a blown bottle, a sound Airbus has since quietened with a small vortex generator
fitted ahead of it. Most have small triangular fences above and below each wingtip; many later ones
have sharklets, the tall curved winglets of the neo.

In January 2009 a US Airways A320 lost both engines to a flock of Canada geese climbing out of
LaGuardia, and its crew ditched it in the Hudson River. All 155 aboard survived.
"""

