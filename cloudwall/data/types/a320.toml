production = [1988, 2021]
checked = "2026-11"
sources = [
  "https://en.wikipedia.org/wiki/Airbus_A320_family",
]

text = """
The A320 was the first airliner flown entirely by digital fly-by-wire with a sidestick. When it
entered service in 1988 the control column was gone, and its computers kept the aircraft inside its
limits whatever the pilot asked of the stick. Every Airbus since has been flown the same way, so a
pilot qualified on one moves to another with a short course. The family runs from the 31 m A318 to
the 44.5 m A321 on one cockpit and much the same wing, and its cabin is about 17 cm wider than a
737's, which is why its seats are usually a little roomier.

Next to a 737 it has a rounder, blunter nose and longer landing gear, so it stands higher off the
ground. Older ones whistle on approach: a cavity in a fuel-vent cover under each wing sings like a
blown bottle, a sound Airbus has since quietened with a small vortex generator fitted ahead of it.
Most have small triangular fences above and below each wingtip; the last ones built have sharklets,
the tall curved winglets of the neo.
"""

