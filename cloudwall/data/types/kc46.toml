text = """
It took a decade of scandal and protest to arrive. A plan to lease 767 tankers was frozen in 2003,
and later cancelled, in a corruption case that jailed a former Air Force procurement official who had
sought a job at Boeing. In 2008 the Air Force chose an Airbus A330-based tanker from Northrop Grumman
and EADS instead, reopened the contest after Boeing's protest was upheld, and picked Boeing in 2011.
The first KC-46 was delivered in January 2019, years late, and by 2021 Boeing's losses on it were put
at $5 billion. It is a hybrid 767: the fuselage of a 767-200ER with the wing, landing gear, cargo
door and floor of the 767-300 freighter, the flaps of the 767-400ER, and a cockpit based on the
787's.

Where the KC-135's boom operator lies at a window in the tail, the KC-46's sits behind the flight
deck and flies the boom by camera, watching a 3D display through stereoscopic glasses that works
even with both aircraft blacked out at night. That Remote Vision System became the programme's most
notorious problem, its picture distorting depth and motion, and a redesign with new cameras and a
colour high-definition display is meant to cure it. Besides the boom it has hose-and-drogue units
under each wing and the fuselage, so it can refuel both kinds of receiver on one sortie, and it can
take on fuel itself. From below it is a grey 767 with a boom under its tail and pods under its wings.
"""

