name = "Ultralight helicopter"
types = ["UHEL"]
checked = "2026-11"
sources = [
  "https://www.icao.int/operational-safety/doc-8643-aircraft-type-designators/special-designators",
  "https://www.faa.gov/documentLibrary/media/Order/FAA_Order_JO_7360.1K_Aircraft_Type_Designators.pdf",
  "https://en.wikipedia.org/wiki/Robinson_R22",
