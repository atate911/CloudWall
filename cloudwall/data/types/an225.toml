text = """
Only one An-225 was ever finished, and with a maximum takeoff weight of 640 tonnes it was the
heaviest aircraft ever built. It was made to carry the Soviet Buran space shuttle and the boosters of its Energia rocket on
its back, so Antonov stretched the An-124, gave it a new centre wing carrying two more engines, six
in all, and swapped the single fin for twin fins out of the turbulence trailing from a load on top.
It first flew on 21 December 1988 and showed a Buran off at the Paris Air Show the next year, but the
shuttle programme died with the Soviet Union, and from 1994 the Mriya, Ukrainian for "dream", sat in
storage while An-124s borrowed its engines.

Antonov rebuilt it for charter work with a stronger floor, and from 2002 it flew what nothing else
could: in 2009 a generator that, with its frame, weighed 189,980 kg, the heaviest single item ever
sent by air, and in 2010 two wind turbine blades 42.1 m long, the longest. Crowds gathered to watch
it land, and in Perth in 2016 they jammed the roads around the airport.
It was at its base at Hostomel, outside Kyiv, after an engine change, when Russia invaded on 24
February 2022, and it was destroyed in the fighting for the airfield. A second airframe, left
unfinished when the Soviet Union collapsed, survives, and by 2023 Antonov had taken parts from the
wreck to complete it.
"""

