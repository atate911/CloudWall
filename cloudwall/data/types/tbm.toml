text = """
A TBM 900 cruises at up to 330 knots on a single 850 shp Pratt & Whitney Canada PT6A, and Aviation
Week found it faster than a Cessna Citation Mustang jet over a 600 nm trip, on 26% less fuel. Its
name records where it began: TB for Tarbes, the town in south-west France where Socata built it, and
M for Mooney, whose six-seat pressurised piston prototype, the Mooney 301, was its starting point.
Mooney left the venture in 1991, and Daher, which bought Socata in 2009, builds it now, still in
Tarbes.

Its engines are flat-rated, held to a power they can go on delivering high up. The PT6A-64 of the
first TBM 700 was limited to 700 shp, which it could keep up to 25,000 ft on a typical day, and the
TBM 850's 850 shp PT6A-66D was held to 700 for takeoff. Fowler flaps along 80% of the trailing edge
keep the landing speed down. Tell it from the Pilatus PC-12, the other fast single-engine turboprop,
by its smaller size and its conventional tail, where the Pilatus has a T-tail; some TBMs also have a
small pilot's door on the left, ahead of the wing.
"""

