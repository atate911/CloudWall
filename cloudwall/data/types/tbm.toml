more = """
The TBM 900 of 2014 freed the full 850 shp for takeoff and added a 40% larger air intake, a
five-blade propeller and winglets, which together made it about 14 knots faster than the 850. The
TBM 960 of 2022 has a PT6E with digital control of both engine and propeller, a first for the TBM,
and Garmin's emergency autoland, which can fly it to an airport and land it if the pilot can't.
"""
