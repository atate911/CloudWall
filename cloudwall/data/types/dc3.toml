text = """
It first flew on 17 December 1935, 32 years to the day after the Wright brothers. Its wing was built
on Jack Northrop's multi-cellular principle: many small spanwise boxes of stressed skin instead of
one heavy spar. That gave it a structure so strong and so tolerant of damage that one airframe has
now flown more than 91,000 hours. With 21 seats and two radials of 1,000 to 1,200 hp, cruising near
150 knots, it was the first airliner that could make money from passengers alone, without a
government mail contract to keep it afloat.

The war turned it into the C-47 Skytrain, and with the copies built under licence in the Soviet Union
and Japan, 16,079 were made in all. Eisenhower counted the C-47, with the bulldozer, the jeep and the
2½-ton truck, among the equipment most vital to the Allies' success in Africa and Europe. It's easy
to know overhead from its two big round engines and their slow, steady drone; on the ground it sits
tail-down on a small wheel under the tail. Eight decades after the last was built, a few still earn
a living. Basler rebuilds them with Pratt & Whitney PT6 turboprops and a fuselage a metre longer,
and some fly cargo in Antarctica.
"""

