text = """
The ERJ began in 1989 as a jet-powered stretch of Embraer's EMB 120 Brasilia turboprop, and it kept
the Brasilia's narrow fuselage, three abreast with one seat on one side of the aisle and two on the
other. The engines moved from above the wing to beneath it before the design settled, late in 1991,
on two Rolls-Royce AE 3007 turbofans (Allison engines at the time) at the back, under a T-tail. That
gave a 50-seat airliner almost 30 m long on a wing barely 20 m across, and more seats would have
needed a wider fuselage, a bigger wing and more thrust. Next to a CRJ, the other tail-engined
regional jet, it is slimmer and three abreast rather than four, and except on the 145XR its wingtips
carry no winglets.

The ERJ 145 entered service with Continental Express in April 1997, and Embraer then shrank it
rather than stretching it. The 37-seat ERJ 135 is 3.54 m shorter and the 44-seat ERJ 140 1.42 m
shorter; both share 95–96% of their parts with the 145, and pilots fly all three on one type rating.
The ERJ 140 existed because pilot contracts at major US airlines limited how many 50-seaters their
regional partners could fly, and American Eagle took most of them. The shorter models fly further: a
full ERJ 135LR about 1,750 nm, an ERJ 145LR 1,550. Production ended in 2020, and as of 2026 no ERJ
airliner has been in an accident that killed anyone aboard.
"""

