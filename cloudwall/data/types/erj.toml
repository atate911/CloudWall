more = """
The XR, for extra-long range, added winglets, strakes and a fuel tank in the rear fuselage, with AE
3007A1E engines of 8,917 lb thrust, and cruises at Mach 0.80 where the others manage 0.78.
ExpressJet, the airline that had launched the ERJ 145 as Continental Express, launched it too.
"""
[variants.E45X.facts]
"Range" = "2,000 nm (3,700 km)"
"Engines" = "2 × Rolls-Royce AE 3007A1E"

[variants.E35L]
name = "Embraer Legacy 600 / 650"
production = [2002, 2020]
text = """
The Legacy 600 is an ERJ 135 made into a business jet, with extra fuel tanks in the tail and ahead
of the wing, winglets and other drag reductions, and certification to 41,000 ft against the
airliner's 37,000. It carries 13 passengers in three cabin sections for up to 3,050 nm, and the
Legacy 650 of 2011 goes further still. Its rival, the Bombardier Challenger, went the other way: a
business jet that grew into the CRJ airliner.

In September 2006 a new Legacy 600 on its delivery flight met a Gol Boeing 737 almost head-on at
37,000 ft over Mato Grosso, Brazil. Its left winglet sliced off about half of the 737's left wing,
and the airliner crashed, killing all 154 aboard, while the damaged Legacy landed at the air force
base at Cachimbo. In August 2023 another, carrying the Wagner Group's leader Yevgeny Prigozhin,
crashed in Russia, killing all ten aboard, after what US intelligence said was a deliberate
explosion.
"""
[variants.E35L.facts]
"Built" = "289"
"Range" = "3,050 nm with 13 passengers (Legacy 600)"
"Ceiling" = "41,000 ft"
