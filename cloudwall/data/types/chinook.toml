text = """
Two big rotors turning in opposite directions, one at each end, cancel each other's torque, so the
Chinook needs no tail rotor and can put all its power into lift. It first flew in 1961 and is still
built, as the CH-47F, for the US Army and many others, and it can carry 26,000 lb from the middle of
the three hooks under its belly.

The civil version, the Boeing 234, and the smaller Vertol 107 it grew from live on with Columbia
Helicopters of Aurora, Oregon, which has owned their type certificates since 2006 and flies them for
logging, construction and firefighting. You'll hear one before you see it: the two rotors give it a
deep, double beat unlike any single-rotor helicopter.
"""

