text = """
Bill Lear, who had made his name with the car radio and aircraft autopilots, set out in 1960 to build
a small, fast business jet in Switzerland, with engineers who had worked on the abandoned FFA P-16
ground-attack fighter. How much the Learjet owes that fighter is still argued over, Lear's own son
calling the close resemblance a story. The work moved to Wichita, Kansas, and the Learjet 23 flew
there on 7 October 1963: six seats, two GE turbojets, a climb of nearly 7,000 ft a minute, and a
price about $400,000 below its rivals'. It made "Learjet" a byword for a private jet. The stretched
25 followed in 1966, and in 1967 Lear sold his share to the Gates Rubber Company.

The airframe kept growing for four decades. The 35 and 36 of 1973 swapped the turbojets for Garrett
turbofans, became the best-selling Learjets and serve the US Air Force as the C-21A, and in 1996
astronaut Pete Conrad and three others flew a 35A round the world in 49 hours 21 minutes. The 28 of
1977 was the first production jet with winglets, which replaced the tip tanks on the 31, 55 and 60;
the 60, built until 2013, was still certified under the Learjet 24's type certificate of 1966. The
early ones are easy to spot: a sharp nose, a T-tail, and a fuel tank on the tip of each wing.
"""

