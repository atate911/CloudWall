text = """
The last of the big trijets, a stretched DC-10 with winglets, a glass cockpit for two pilots and a
third engine set into the base of the tail fin. It fell short of its promised range when it entered
service in 1990, airlines that had ordered it for passengers took 777s and A340s instead, and only
200 were built. Nearly all ended up flying cargo.

To save fuel, McDonnell Douglas gave it a tailplane 30% smaller than the DC-10's, with a fuel tank
inside, and let computers make up for the stability that cost. It comes in fast, at up to 186 knots
on approach, and earned a name among pilots as demanding in the flare. In November 2025 a UPS MD-11
lost its left engine and pylon as it took off from Louisville and crashed, and the FAA grounded the
type until May 2026. UPS retired its MD-11s; as of 2026 FedEx is flying most of its own again.
"""

