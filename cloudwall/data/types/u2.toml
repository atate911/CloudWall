text = """
Lockheed's Skunk Works built it in secret for the CIA, to photograph the Soviet Union from above
70,000 ft, beyond the reach, it was thought, of fighters and missiles. The prototype first left the
ground at Groom Lake in August 1955 during what was meant to be a high-speed taxi test, and in 1960 a
Soviet missile brought down Gary Powers in one. When U-2s began flying above 60,000 ft, in years when
airliners cruised at 10,000 to 20,000, air traffic controllers saw a surge in UFO reports. The U-2S
the US Air Force flies today, like NASA's ER-2, uses the U-2R airframe, nearly 30 percent larger
than the original; most were built in the 1980s, and re-engined in the 1990s with a General
Electric F118 turbofan.

It is in effect a jet-powered glider, with a glide ratio of about 23:1, and at altitude the early
models flew with as little as 10 knots between stalling and their maximum speed. The main wheels sit
one behind the other, under the cockpit and behind the engine, and outrigger wheels called pogos,
plugged into each wing, hold it level until they fall away on takeoff. It floats on its long wing
and will not land until fully stalled, so a second U-2 pilot follows in a chase car calling out its
height until it drops the last two feet onto the runway. Titanium skids protect the wingtips, and
it cannot taxi in until the ground crew has refitted the pogos.
"""

