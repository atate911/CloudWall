text = """
Piper's founder, William T. Piper, asked in 1962 for a six- to eight-seat twin for companies and
feeder airlines, and the Navajo, which looks like a scaled-up Twin Comanche, first flew in
September 1964. Deliveries began in 1967, when West Coast Airlines put it into scheduled service as
its "MiniLiner". The Chieftain of 1972 is 2 ft longer, with up to ten seats and 350 hp turbocharged
Lycomings turning in opposite directions. The Pressurized Navajo, Piper's first pressurised
aircraft, has geared 425 hp engines, and you can tell it by its longer nose, its fewer and smaller
windows, and a one-piece airstair door in place of the split pair of doors on the others.

Hurricane Agnes flooded Piper's Lock Haven factory in June 1972 and held up the first Chieftains by
months. Piper gave NASA 32 aircraft written off in the flood, Navajos among them, and NASA crashed
them on purpose at Langley, Virginia, using the gantry where Neil Armstrong and other Apollo
astronauts had practised landing on the Moon. Production ended in 1984 after 3,942 piston PA-31s,
the last of them including 50 Mojaves, a pressurised hybrid of the Chieftain's tail and the
fuselage of Piper's turboprop Cheyenne.
"""

[facts]
"First flight" = "September 1964"
"Built" = "3,942"
"Engines" = "2 × Lycoming TIO-540, 310 to 350 hp; TIGO-541, 425 hp (Pressurized Navajo)"

