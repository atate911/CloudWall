name = "Piper PA-31 Navajo or Chieftain"

[variants.PAT4]
name = "Piper T-1040 or Neiva Carajá"
production = [1982, 1984]
more = """
The T-1040 was Piper's turboprop for commuter airlines, delivered from July 1982: the fuselage of
the T-1020 commuter Chieftain with the nose, tail and Pratt & Whitney Canada PT6 turboprops of the
Cheyenne I, and an optional cargo pod under its belly. Brazil's Neiva Carajá, a turboprop conversion
of the Chieftain Embraer built under licence, shares its designator.
"""
[variants.PAT4.facts]
