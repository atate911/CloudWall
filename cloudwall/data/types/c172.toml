text = """
More 172s have been built than any other aircraft: more than 45,000 since deliveries began in 1956,
and it is still in production. Generations of pilots learned on one because it forgives mistakes: a
high wing braced by a single strut, fixed tricycle gear, a stall at 48 knots clean and 40 with the
flaps down, and handling that rarely surprises a student. Tell it from a Piper Cherokee, the other
common trainer, by its wing, on top on the Cessna and underneath on the Piper. At its cruise of
about 124 knots, in a stiff headwind it can be slower over the ground than the traffic on the
freeway beneath it.

Cessna stopped building piston aircraft in 1986, when liability lawsuits made them too costly to
insure, and started the 172 again in 1996, two years after Congress limited that liability. In
1958–59 two pilots kept one in the air over Las Vegas for 64 days and 22 hours, refuelling from a
truck racing beneath them, and the record still stands.
"""

