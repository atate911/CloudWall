text = """
Bombardier designed it from a clean sheet as the CSeries, its first step beyond regional jets: wings
of carbon composite built in Belfast, a fuselage of aluminium-lithium, fly-by-wire with sidesticks,
and Pratt & Whitney's PW1500G geared turbofan, whose gearbox lets the big fan turn about a third as
fast as the turbine driving it. That makes it one of the quietest jets of its size. Seats run five
abreast, two on one side and three on the other, so most rows have one middle seat instead of two,
and they are wider than in any other narrowbody's economy cabin.

In 2017 Boeing objected to Delta's order, and the US Commerce Department proposed duties of nearly
300% on the aircraft. Before the International Trade Commission ruled against Boeing in January
2018, Bombardier had already agreed to hand control of the programme to Airbus for a token sum.
Airbus renamed it the A220 and opened a second assembly line in Mobile, Alabama, where many of the
A220s flying in the US are built. From the ground, look for engines that seem too big for the
aircraft, slung well forward under a wing that ends in a small, upswept winglet.
"""

