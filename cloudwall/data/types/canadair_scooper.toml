text = """
The first aircraft designed from the outset to fight fires with water. Quebec wanted a replacement
for the Canso flying boats it used as water bombers, and Canadair's answer, the CL-215, first flew
on 23 October 1967 with two Pratt & Whitney R-2800s, the radial of the Hellcat and the Corsair. It
reloads without stopping: the pilot settles it onto a lake or the sea, skims along on the hull
with scoops lowered into the water, and climbs away full. The later CL-415 takes on 6,140 litres
in a run of about 12 seconds and 410 m, can take a partial load from a smaller stretch of water or
turn while it scoops, and can mix foam into the load before dropping it on the fire.

The first CL-215 went to France's Sécurité Civile in 1969, and 125 were built for 11 countries
until 1990. The CL-415 followed from 1994, with winglets and Pratt & Whitney Canada PW123
turboprops mounted closer to the fuselage, and older aircraft re-engined with the same turboprops
became CL-215Ts. Bombardier closed the line in October 2015 after 95 CL-415s. Viking Air bought the
programme in 2016 and in 2022 relaunched it as the De Havilland Canada DHC-515; as of 2026 the
first was being assembled in Calgary, for Greece, one of six European countries buying 22 through
an EU-backed order.
"""

