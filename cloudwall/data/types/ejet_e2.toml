text = """
The E2 keeps the first E-Jets' fuselage cross-section and much of their cockpit, so a pilot moves
across in two and a half days without a full flight simulator, but three-quarters of its parts are
new. Its Pratt & Whitney PW1900G is a geared turbofan: a gearbox lets the 185 cm fan turn slower than
the turbine driving it, and it pushes about twelve times as much air around the core as through it.
The engines are 66 cm wider than the CF34s they replace, so the landing gear is taller. The new wing
spans 33.7 m on the E190-E2 against the E190's 28.7 m and has simpler single-slotted flaps, and
closed-loop fly-by-wire let Embraer shrink the tail. In flight tests the E190-E2 burned 17.3% less
fuel than the E190: 11 points from the engines, 4.8 from the wing and 1.5 from the smaller tail.

The E195-E2 is three seat rows longer than the E195, with a longer wingtip, and since November 2023
it has been the largest aircraft cleared for London City's steep approach. On takeoff and landing
its combustion chambers can resonate, with a sound Amsterdam's Schiphol airport has compared to a
whale's call; it does no harm, and Embraer has said it will redesign the combustor. Widerøe flew the first E2 into service, the
E190-E2, between Bergen and Tromsø in April 2018. Tell an E2 from the first E-Jets by its long,
slender wing, which ends in a raked tip instead of a winglet, and its bigger engines.
"""

