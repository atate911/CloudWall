text = """
When the proposal reached Kelly Johnson in 1951, the engineer later famous for the U-2 and SR-71
told Lockheed's chief engineer that signing it would destroy the company. The Air Force wanted a
transport designed for combat from the start, loaded over a ramp under the tail that could also drop
cargo in flight, and able to use short, rough strips; Allison developed the T56 turboprop for it.
The prototype flew in August 1954, and the C-130 has been built ever since, more than 2,700 of them
by 2024, the longest continuous production of any military aircraft. It flies for more than 60
countries, as transport, gunship, tanker, hurricane hunter and, on skis, supply aircraft for the
Greenland ice cap and Antarctica.

In 1963 a Marine KC-130F made 21 full-stop landings on the carrier USS Forrestal with no tailhook
and took off again each time without a catapult; it is still the largest aircraft ever to land on a
carrier. In 1976 four Israeli Hercules flew commandos 2,200 nm to Entebbe, mostly below 100 ft, to
free hijacked passengers. The C-130J, flying since 1996, keeps the shape but has Rolls-Royce
engines, a two-pilot glass cockpit and composite six-bladed propellers with swept, scimitar tips,
the quickest way to tell it from the older Hercules and their four blades.
"""

