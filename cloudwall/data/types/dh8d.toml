text = """
The fastest turboprop airliner flying, cruising at around 360 knots on two Pratt & Whitney Canada
PW150s of 5,000 shp each, so on short routes it keeps pace with regional jets while burning far less
fuel. The "Q" it was marketed under stood for quiet: microphones and speakers in the cabin cancel the
propeller's drone. It seats up to 90.

From the ground it is long and slender, with a high wing, a T-tail, six-bladed propellers and long
engine nacelles the main gear folds into. In 2007 SAS grounded and then retired its fleet after
three landing-gear collapses in two months.
"""

