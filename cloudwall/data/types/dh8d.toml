text = """
It cruises at up to 360 knots, close to most regional jets, on two Pratt & Whitney Canada PW150As
of up to 5,071 shp each, and burns far less fuel doing it. The "Q" it was marketed under stood for
quiet: microphones in the cabin tell vibration absorbers on the fuselage frames how to counter the
propellers' drone. It seats up to 90.

From the ground it is long and slender, with a high wing, a T-tail, six-bladed propellers and long
engine nacelles the main gear folds into. In September 2007 the landing gear of two SAS Q400s
collapsed within four days, and after a third gear failure in October SAS retired its fleet for
good. De Havilland Canada delivered the last new one in 2022 and, as of 2026, has not restarted
production.
"""

