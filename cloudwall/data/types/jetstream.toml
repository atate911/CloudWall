sources = [
  "https://en.wikipedia.org/wiki/British_Aerospace_Jetstream",
  "https://en.wikipedia.org/wiki/Handley_Page_Jetstream",
]

text = """
Handley Page designed the Jetstream in the mid-1960s, hoping to stay independent of Britain's two big
aircraft makers with a fast 12- to 18-seat airliner for the American commuter market. Streamlining
gave it its long nose, and a round pressurised fuselage let it fly higher and faster than its
unpressurised rivals, though the wing spar crossed the cabin as a step in the aisle. It first flew
on 18 August 1967, but its French Astazou engines proved underpowered and temperamental, the costs
ran to more than four times the estimate, and Handley Page went bankrupt; the line closed in 1970.
Scottish Aviation kept building it, and the RAF trained its multi-engine pilots on it.

British Aerospace, which absorbed Scottish Aviation in 1978, saw that the design was worth more and
re-engined it with Garrett TPE331 turboprops as the Jetstream 31, seating 18 three abreast with an
offset aisle and offering water-methanol injection to lift full loads out of hot airfields in the
United States and Australia. It first flew on 28 March 1980, was certified on 29 June 1982, and sold
as Handley Page had hoped the original would: 386 Jetstream 31s and 32s were built until 1993.
"""

[facts]
