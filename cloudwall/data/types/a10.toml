text = """
The A-10 was built around its gun. The Air Force wrote a 30 mm rotary cannon into the requirement,
and Fairchild Republic shaped the fuselage around General Electric's seven-barrel GAU-8 Avenger,
which with its drum full weighs more than 4,000 lb. The gun is mounted a little to the left so the
barrel that is firing always lies on the centreline, and the nose wheel is offset to the right to
make room. Its recoil averages 10,000 lb of force, slightly more than the thrust of either of the
jet's two engines. The pilot sits in a 1,200 lb tub of titanium armour, and the A-10 is designed to
fly with one engine, half its tail, one elevator and half a wing gone. Over Baghdad in 2003, Captain
Kim Campbell flew one for nearly an hour with an engine damaged and the hydraulics knocked out,
steering on its mechanical backup controls, and landed it safely.

Nothing else looks like it: straight, broad wings for slow, tight flying close to the ground, twin
fins at the ends of the tailplane, and two engine pods perched high on the rear fuselage, where
they are less likely to swallow debris from rough strips and can keep running while the ground
crew rearm it. Many parts, the engines, main gear and fins among them, fit either side. Its crews
named it the Warthog. Congress has resisted the Air Force's attempts to retire it for more than a
decade, and as of 2026 the Air Force plans to keep it flying until 2030.
"""

