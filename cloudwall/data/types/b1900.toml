text = """
Beechcraft made the 1900 by stretching its Super King Air into a 19-seat airliner, the most a US
airline can carry without a flight attendant, and kept the King Air's cockpit, controls and Pratt &
Whitney Canada PT6A engines. The longer fuselage left the T-tail in the wing's disturbed air at high
angles of attack, so Beechcraft added "stabilons", small fixed tailplanes on the rear fuselage below
it. The 1900D of 1991 raised the roof into a stand-up cabin, something few 19-seaters offer, and
paid for the extra weight and drag with more powerful PT6A-67D engines, winglets, and a bigger tail
with extra fins. Like the King Air it is certified for a single pilot in cargo and corporate flying,
though US passenger airlines must fly it with two.

Raytheon, Beechcraft's owner by then, built 695, 439 of them 1900Ds, before stopping in 2002 as
airlines turned to regional jets. The D's tall cabin makes it a good freighter: converted, it holds
900 cubic feet, 30% more than a 1900C and nearly as much as the larger Embraer Brasilia. In 2003 an
overloaded Air Midwest 1900D, its elevator cables wrongly rigged, crashed on takeoff from Charlotte,
killing all 21 aboard. The NTSB found that the standard passenger weight the airline had used, which
the FAA had not revised since 1936, was more than 20 lb too light.
"""

