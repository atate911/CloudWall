text = """
The G500 and G600 replaced the G450 and G550 with the G650's ideas at a smaller scale: a fuselage
built up from four circular arcs, 7 in narrower and lower than the G650's but wider and taller than
the cabins it replaced, a wing based on the G650's with the same sweep, a tail shaped like the
G650's, and fly-by-wire controls. In the new Honeywell cockpit the pilots fly with sidesticks, as
in an Airbus, but these are active, driven electrically so that each moves when the other does, as
linked yokes would; they were the first civil aircraft built that way. The overhead panel is three
touch-screens instead of rows of switches.

Unusually for Gulfstream, the engines are not Rolls-Royces but Pratt & Whitney Canada PW800s, which
use the core of Pratt's geared turbofan airliner engine without the gearbox. The cabin is held at a
4,850 ft altitude at the 51,000 ft ceiling. The G600 is 5 ft longer, with 8 ft more wingspan and
11,250 lb more fuel, and flies 6,600 nm to the G500's 5,300 nm.
"""

