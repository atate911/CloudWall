text = """
A Boeing 707 carrying a radar disc 30 ft across and 6 ft thick on two struts above its rear
fuselage, tilted slightly nose-down to cut its drag. The disc, the rotodome, turns a radar that looks
down to pick out low-flying aircraft against the clutter of the ground more than 400 km away, while
a mission crew at 14 consoles in the cabin builds the air picture and directs fighters and tankers.
In the Gulf War, E-3 controllers had a hand in 38 of the coalition's 41 air-to-air kills. 68 were
built between 1977 and 1992, and they and the E-6 kept the 707 line open until 1991, long after the
last airliner.

The American and NATO aircraft kept the 707's Pratt & Whitney TF33s and stay up for about eight
hours unrefuelled; those built later for Saudi Arabia, Britain and France have CFM56s and last about
11. NATO's fleet, based at Geilenkirchen in Germany and crewed from many member nations, is
registered in Luxembourg, so its aircraft carry LX- registrations. Britain retired its E-3Ds in
2021 and sold three to Chile.
"""

