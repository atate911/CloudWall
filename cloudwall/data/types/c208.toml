text = """
A big single-engine utility aircraft built around a PT6 turboprop, with a high strut-braced wing,
fixed gear tough enough for gravel and grass, and a cargo pod slung under the belly. FedEx was its
launch customer and in 2025 still flew more than 200 as feeders, carrying packages between the
cities its jets serve and the towns they don't, and it works on floats and skis, as a skydiving jump
ship and as a small airliner on short hops.

More than 3,000 have been delivered since 1985, and FedEx is replacing its own with the twin-engined
SkyCourier, another Cessna built to its order. From the ground it looks like an oversized Cessna
single, with a long nose for the turbine, an exhaust stack on its right side and, on most, that pod
underneath.
"""

