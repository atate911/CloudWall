text = """
A jet spy plane with nobody aboard, able to fly its mission on its own, with pilots on the ground
taking direct control by satellite only in busy airspace. The RQ-4B's composite wing spans 130.9 ft,
wider than a 737's, and a single Rolls-Royce AE 3007 turbofan, the engine of Embraer's ERJ regional
jets, sits on its back with its exhaust between the arms of a V-tail; the bulge over the nose houses
the satellite antenna. It can stay up for 30 hours and survey 100,000 km² of ground in a day, an area
the size of Iceland.

In April 2001 one flew nonstop from Edwards Air Force Base in California to RAAF Base Edinburgh in
Australia in 22 hours, the first pilotless aircraft to cross the Pacific, and in 2008 another stayed
up for 33.1 hours. It has flown over Afghanistan, Iraq and Libya, and from Sicily off Crimea and over
Ukraine; NASA has used two of the first ones to study hurricanes, and NATO's RQ-4D Phoenix
and the US Navy's MQ-4C Triton grew from it. The Air Force had planned to retire its Global Hawks in
2027, but as of 2026 Congress has pushed that back to 2030 at the earliest.
"""

