[variants.AS55]
name = "Eurocopter AS355 Écureuil 2 (TwinStar)"
more = """
The AS355 Écureuil 2, the TwinStar in North America, is the same helicopter with two engines, at
first a pair of Allison 250s. It first flew in September 1979, and police forces were among its
buyers. The last version, the AS355 NP of 2007, has two Turbomeca Arrius and the AS350 B3's gearbox,
and production ended in 2016.
"""
