[variants.H53S]
name = "Sikorsky CH-53E Super Stallion or CH-53K King Stallion"
production = [1981]
more = """
The CH-53E Super Stallion, first flown in 1974 and in service from 1981, added a third engine and a
seventh rotor blade, and its tail rotor is tilted 20° so that it gives some lift in the hover as
well as countering the torque, with a tailplane set high on the opposite side. It can lift 36,000
lb on its hook. The CH-53K King Stallion, delivered from 2018, has three GE T408s of 7,500 shp
each, fly-by-wire controls, composite blades and a cabin a foot wider, room for two standard cargo
pallets. It is the largest and heaviest helicopter in the US military.
"""
[variants.H53S.facts]
"First flight" = "March 1974 (CH-53E); October 2015 (CH-53K)"
