text = """
For the Marines' heavy-lift competition of 1962, Sikorsky scaled up its S-61R, rear ramp and all,
and gave it two General Electric T64 engines and the rotor and drive system of the S-64 Skycrane.
The CH-53 Sea Stallion first flew in October 1964 and reached the Marines in 1966, and in Vietnam
it recovered more downed aircraft than the Skycrane did. On the night of 26 December 1969, during
the War of Attrition, two Israeli CH-53s crossed the Red Sea to Ras Gharib in Egypt, where
paratroopers had taken apart a new Soviet P-12 radar station, and carried it back to Sinai. The
four-ton radar was more than one CH-53 could lift: it had to land short, and another relayed the
radar the rest of the way.

West Germany's army received 110 CH-53Gs, built under licence by VFW-Fokker, between 1971 and 1975,
and in 2022 Germany chose Chinooks to replace them. Israel chose the CH-53K to replace its own,
which it calls the Yas'ur. Iran's navy added to its RH-53Ds five that the US Navy abandoned in Iran
in 1980, during the failed attempt to rescue the American hostages.
"""

[facts]
