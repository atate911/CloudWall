text = """
Bell's light twin of 2000, built with Samsung Aerospace of South Korea, which made the fuselage and
tail boom at Sacheon for final assembly at Mirabel, Quebec. It was the first Bell designed entirely
on computer, and it put a four-bladed rotor with a composite hub, like the 407's, over two Pratt &
Whitney Canada PW207D engines with digital controls, in a mostly composite cabin 13 inches longer
than the 407's and free of the roof beam that crosses the cabins of the 206 and 407.

It was meant for air ambulances, but its cabin was too small to take a stretcher well, and it could
not be flown on instruments by a single pilot. Bell stretched it into the 427i, then gave up on the
airframe, and in 2005 the 80 orders for the 427i became orders for the all-new 429. The last 427s
were delivered in 2010.
"""

