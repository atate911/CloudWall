text = """
The 421 Golden Eagle is Cessna's 411 with a pressurised cabin, and when it appeared in 1967 it sold
200 in its first year. Like the 411 it has geared engines: its turbocharged Continental GTSIO-520s drive their
propellers through a reduction gearbox, so each six-cylinder engine can turn fast enough to make
375 hp while its propeller turns slower. The turbochargers also supply the air that pressurises the
cabin. Those geared engines, an ageing pressurisation system and the insurance make it an expensive
aircraft to keep. Some have been converted to turboprops, and Cessna itself developed the 421 into
a turboprop, the 425 Conquest I.

The 414 of 1968 put the 421's cabin on the wing of the cheaper 401, with direct-drive 310-hp
engines, as a less costly way into pressurisation. Both later moved their fuel from the wingtips
into the wing itself, the 421C in 1976 and the 414A Chancellor, on a longer wing, in 1978, so the
ones with plain wingtips are the later models. Cessna built both until 1985.
"""

