[variants.F50]
name = "Fokker 50"
production = [1987, 1997]
text = """
The Fokker 50 is an F27-500 brought up to date. Fokker launched it in November 1983, alongside the
Fokker 100 jet, as Friendship sales began to fall, and kept the airframe largely as it was, but
replaced the Darts with Pratt & Whitney Canada PW100s turning slow, six-bladed Dowty propellers.
Fuel burn fell by 30%, and the slow propellers and vibration absorbers keep the cabin quiet without
active noise control. It has twice as many windows as the F27, each smaller, small upturned wingtips
that act as winglets, a two-wheel nose gear and a glass cockpit, with a single lever setting both
engine power and propeller pitch. The wings came from SABCA in Belgium, fuselage sections from
Dassault, the flaps from MBB and the tail surfaces from Fuji in Japan.

It first flew in December 1985 and the German airline DLT took the first in 1987, but Fokker's
losses on the 50 and the Fokker 100 drove it into bankruptcy in March 1996, and the last of 213 was
delivered in 1997. Fokker also built four of a stretched freighter, the Fokker 60, for the Royal
Netherlands Air Force, which later sold them to the Peruvian Navy.
"""
[variants.F50.facts]
