text = """
Fokker designed the Friendship in the early 1950s to replace the DC-3, after asking the airlines
flying DC-3s what they wanted of a new aircraft. It chose two Rolls-Royce Dart turboprops, already
proven on the Vickers Viscount and far quieter and smoother than piston engines, a pressurised
cabin, and a high wing, which gives a low floor for easy loading and every passenger a clear view
down. Much of the structure is bonded metal to metal with Redux adhesive rather than riveted, a
technique only de Havilland had used before, and it made the airframe lighter and longer-lived. The
prototype flew in November 1955 and the F27 entered service three years later. Sales were slow at
first, and Fokker needed help from banks and the Dutch government to keep building it until orders
took off in 1960.

Fairchild built it under licence in the United States from 1958, and developed its own stretched
FH-227 from it. The F27-500 of 1967 added 1.5 m (4 ft 11 in) to the fuselage and seats for up to 52,
and there were combi, freighter, troop-carrying and maritime patrol versions. It became the
best-selling European turboprop airliner, and production went on until 1987. Later in life many were
turned into freighters, and the US Army's Golden Knights parachute team jumped from one from 1985.
"""

