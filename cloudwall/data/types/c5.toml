text = """
Lockheed beat Boeing to build it in 1965, and Boeing turned its losing design's raised cockpit and
opening nose into the 747. The C-5's engine, GE's TF39, was the first big high-bypass turbofan, with
eight times as much air flowing around its core as through it when every engine before had managed
less than two, and it grew into the CF6 that went on to power the DC-10, 747 and A300. The nose
swings up and a ramp drops at the tail so vehicles can load from either end, the 28-wheel landing
gear kneels to bring the floor down to truck-bed height, and the six-wheel main units swivel for
crosswind landings. The hold is 121 ft long, a foot longer than the Wright brothers' first flight.
It shares the C-17's high wing and T-tail but dwarfs it, and its wingtips are plain where the C-17's
turn up into winglets.

It was the first development programme to overrun its budget by a billion dollars, and its wings
cracked so soon that 77 C-5As were given new ones in the 1980s. In 1974 a C-5A dropped a Minuteman
missile by parachute over the Pacific, and its motor fired in midair, proving an ICBM could be
launched from the air. Lockheed built 81 C-5As and 50 C-5Bs, and between 2006 and 2018 the 52 kept
in service were rebuilt as C-5M Super Galaxies, with CF6 engines 22 percent more powerful that cut
the takeoff run by 30 percent.
"""

