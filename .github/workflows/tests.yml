# Runs the test suite on every pull request and on main. The tests use no network and no
# packages beyond Python's own. Node is there for the tests of the page's drawing modules, and a
# browser (Playwright's Chromium) for the smoke test that walks the page itself: CloudWall needs
# neither to run.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]     # 3.14: the production server's
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A browser, for the page's smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Lint (undefined and unused names, Python and JavaScript)
        run: |
          pip install --quiet pyflakes
          python -m pyflakes cloudwall tests tools coverage3d
          npm install --no-save eslint@9
          npx eslint cloudwall/web/js coverage3d/coverage3d/web
      - name: Tests
        run: python -m unittest discover -s tests
        env:
          CLOUDWALL_BROWSER_TESTS: "1"      # the browser tests must run here, not be skipped
      - name: Coverage3D's tests (until it is folded into CloudWall)
        run: python -m unittest discover -s tests
        working-directory: coverage3d
      - name: Installs and starts as a package
        run: |
          pip install .
          cd "$RUNNER_TEMP" && cloudwall --version

  # The parts the unit tests can only pretend at: a real install under systemd on the runner, then an
  # update, the way back, a backup put back, a request to the root helper, and taking it off again.
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, update, roll back, restore, uninstall
        run: |
          set -euo pipefail
          py=/usr/bin/python3
          answers() {
            for i in $(seq 30); do
              if curl -sf http://127.0.0.1:5050/api/state -o /tmp/state.json; then
                $py -c "import json; s = json.load(open('/tmp/state.json')); print('  answering: api', s['api'], 'started', s['started'])"
                return 0
              fi
              sleep 2
            done
            echo "CloudWall didn't answer"; sudo journalctl -u cloudwall -n 40 --no-pager; return 1
          }
          say() { printf '\n===== %s\n' "$*"; }

          say "install"
          sudo $py -m cloudwall install
          systemctl is-active cloudwall
          answers
          first=$(readlink /opt/cloudwall/current)
          sudo cloudwall doctor --offline || true

          say "install again: nothing to change, nothing restarted"
          before=$(systemctl show cloudwall -p ActiveEnterTimestampMonotonic --value)
          sudo $py -m cloudwall install
          test "$before" = "$(systemctl show cloudwall -p ActiveEnterTimestampMonotonic --value)"

          say "upgrade to changed code"
          echo "# rehearsal" >> cloudwall/__init__.py
          sudo $py -m cloudwall upgrade
          second=$(readlink /opt/cloudwall/current)
          test "$first" != "$second"
          sudo sh -c 'ls /var/lib/cloudwall/backups/cloudwall-*.tar.gz'      # (the folder is the service's alone)
          answers

          say "settings that wouldn't start stop an upgrade before it changes anything"
          sudo cp /etc/cloudwall/config.toml /tmp/good.toml
          echo '[tracking]' | sudo tee -a /etc/cloudwall/config.toml >/dev/null
          echo 'radius_nm = "far"' | sudo tee -a /etc/cloudwall/config.toml >/dev/null
          echo "# rehearsal 2" >> cloudwall/__init__.py
          if sudo $py -m cloudwall upgrade; then echo "the upgrade went ahead with broken settings"; exit 1; fi
          test "$second" = "$(readlink /opt/cloudwall/current)"
          sudo cp /tmp/good.toml /etc/cloudwall/config.toml
          sudo chown cloudwall:cloudwall /etc/cloudwall/config.toml

          say "rollback"
          sudo cloudwall rollback
          test "$first" = "$(readlink /opt/cloudwall/current)"
          answers

          say "backup, a change, restore"
          sudo cloudwall backup --to /tmp/rehearsal.tar.gz
          echo '[kiosk]' | sudo tee -a /etc/cloudwall/config.toml >/dev/null
          echo 'view = "radar"' | sudo tee -a /etc/cloudwall/config.toml >/dev/null
          sudo cloudwall restore /tmp/rehearsal.tar.gz --yes
          if sudo grep -q 'view = "radar"' /etc/cloudwall/config.toml; then echo "restore didn't put the settings back"; exit 1; fi
          test "$(sudo stat -c %U /etc/cloudwall/config.toml)" = cloudwall
          answers

          say "the root helper does what the service asks, and only that"
          rid=$(sudo -u cloudwall env PYTHONPATH=/opt/cloudwall/current $py -c "from cloudwall.operate import helper; print(helper.ask('enable-service'))")
          for i in $(seq 15); do sudo test -e /var/lib/cloudwall-helper/done/$rid.json && break; sleep 1; done
          sudo cat /var/lib/cloudwall-helper/done/$rid.json; echo
          sudo grep -q '"ok": true' /var/lib/cloudwall-helper/done/$rid.json
          if sudo -u cloudwall touch /var/lib/cloudwall-helper/done/planted 2>/dev/null; then echo "the service can write where root writes results"; exit 1; fi

          say "uninstall"
          sudo cloudwall uninstall --purge
          test ! -e /etc/cloudwall && test ! -e /opt/cloudwall && test ! -e /etc/systemd/system/cloudwall.service
