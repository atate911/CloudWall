[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudwall"
description = "A flight status board for the sky over your house"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.scripts]
cloudwall = "cloudwall.app.main:main"

[tool.setuptools.packages.find]
include = ["cloudwall", "cloudwall.*"]        # every layer's folder, found rather than listed

[tool.setuptools.package-data]
cloudwall = ["web/*", "web/js/*", "web/js/profiles/*", "web/maps/*", "web/fonts/*", "data/*", "data/types/*", "radio/README.md", "config.example.toml"]

[tool.setuptools.dynamic]
version = { attr = "cloudwall.__version__" }
